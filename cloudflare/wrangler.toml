# Popote sur Cloudflare : la page (public/, préparée par preparer.py) et l'API (src/worker.js).
name = "popote"
main = "src/worker.js"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Comptes, clés d'accès, sessions, invitations, documents des foyers, abonnements aux rappels.
[[d1_databases]]
binding = "BASE"
database_name = "popote"
database_id = "1b8f7f59-a056-4d80-b72b-6f5c4d93eb60"

# Rappels envoyés à 18 h, heure de La Réunion (UTC+4).
[triggers]
crons = ["0 14 * * *"]

[vars]
FUSEAU = "Indian/Reunion"
CONTACT = "https://github.com/quevanicolas-stack/Marmite"
CHEF_PAR_JOUR = "30"
TICKETS_PAR_JOUR = "15"

# Secrets (jamais dans ce fichier) : INVITATION_INITIALE (le premier code d'invitation, réutilisable),
# ANTHROPIC_API_KEY (lecture des tickets et « J'ai faim » ; sans elle, tout le reste marche).
