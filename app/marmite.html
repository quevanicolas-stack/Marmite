<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marmite — nos repas et notre budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<script>
/* Thème choisi sur cet appareil, appliqué avant l'affichage */
try { const t = localStorage.getItem("marmite-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/* ---------- Palette Fluent & Forward ---------- */
:root{
  --vert:#1B6B4A; --profond:#10382A; --or:#C9A96E; --sable:#E8DDD0; --creme:#FAF7F2; --encre-ff:#2C1810;
  --fond:var(--creme); --surface:#FFFFFF; --surface-2:#F2EBE0; --trait:#E8DDD0; --encre:var(--encre-ff); --brume:#7A6A5E;
  --primaire:var(--vert); --sur-primaire:#FAF7F2; --accent:var(--or); --titre-c:var(--profond);
  --c-pdj:#C9A96E; --c-dej:#1B6B4A; --c-din:#5E9C7F; --c-des:#9C7A45;
  --alerte:#A2412B; --ok:#1B6B4A; --ombre:0 1px 0 rgba(44,24,16,.06);
  --titre:"Plus Jakarta Sans", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --texte:"DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fond:#10382A; --surface:#15432F; --surface-2:#1C5039; --trait:#2A614A; --encre:#FAF7F2; --brume:#CDBFAE;
    --primaire:#C9A96E; --sur-primaire:#10382A; --titre-c:#FAF7F2;
    --c-pdj:#C9A96E; --c-dej:#6FB896; --c-din:#A8D5BF; --c-des:#E3C893;
    --alerte:#F0A089; --ok:#8FD1AF; --ombre:0 1px 0 rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --fond:#10382A; --surface:#15432F; --surface-2:#1C5039; --trait:#2A614A; --encre:#FAF7F2; --brume:#CDBFAE;
  --primaire:#C9A96E; --sur-primaire:#10382A; --titre-c:#FAF7F2;
  --c-pdj:#C9A96E; --c-dej:#6FB896; --c-din:#A8D5BF; --c-des:#E3C893;
  --alerte:#F0A089; --ok:#8FD1AF; --ombre:0 1px 0 rgba(0,0,0,.25);
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; min-height:100%; background:var(--fond); color:var(--encre); font:16px/1.5 var(--texte); -webkit-font-smoothing:antialiased; transition:background .25s; }
button,input,select{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--or); outline-offset:2px; border-radius:6px; }
svg{ max-width:100%; }
.ico{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; flex:none; }

/* ---------- Mise en page ---------- */
.app{ display:grid; min-height:100vh; }
.rail{ display:none; }
.hautbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 18px 0; max-width:760px; margin:0 auto; }
main{ padding:14px 18px 110px; max-width:760px; width:100%; margin:0 auto; }
.barre{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--trait);
  display:grid; grid-template-columns:repeat(5,1fr); padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px)); }
.barre button,.rail .nav button{ background:none; border:0; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px;
  font-size:12px; font-weight:700; color:var(--brume); border-radius:12px; }
.barre button[aria-current="page"],.rail .nav button[aria-current="page"]{ color:var(--titre-c); }
.barre button[aria-current="page"] .ico{ stroke:var(--or); }
@media (min-width:960px){
  .app{ grid-template-columns:232px 1fr; }
  .barre,.hautbar{ display:none; }
  .rail{ display:flex; flex-direction:column; gap:18px; position:sticky; top:0; height:100vh; padding:28px 16px; background:var(--surface); border-right:1px solid var(--trait); }
  .rail .nav{ display:flex; flex-direction:column; gap:4px; }
  .rail .nav button{ flex-direction:row; gap:12px; font-size:15px; padding:10px 12px; justify-content:flex-start; }
  .rail .nav button[aria-current="page"]{ background:var(--surface-2); }
  .rail .bas{ margin-top:auto; }
  main{ padding:34px 40px 60px; max-width:1060px; }
}
.marque{ font-family:var(--titre); font-weight:800; font-size:22px; letter-spacing:-.02em; color:var(--titre-c); display:flex; align-items:center; gap:8px; }
.marque svg{ width:28px; height:28px; }
.qui{ display:grid; grid-template-columns:1fr 1fr; background:var(--surface-2); border-radius:999px; padding:3px; }
.qui button{ border:0; background:none; border-radius:999px; padding:6px 12px; font-weight:700; font-size:14px; color:var(--brume); }
.qui button[aria-pressed="true"]{ background:var(--primaire); color:var(--sur-primaire); }
.theme{ display:inline-flex; align-items:center; gap:8px; border:1px solid var(--trait); background:var(--surface); border-radius:999px; padding:7px 12px; font-weight:700; font-size:14px; }
.theme .ico{ width:18px; height:18px; }
.hautbar .theme span{ display:none; }
@media (min-width:420px){ .hautbar .theme span{ display:inline; } }

/* ---------- Typographie ---------- */
h1,h2,h3{ font-family:var(--titre); letter-spacing:-.015em; margin:0; color:var(--titre-c); }
h1{ font-size:clamp(28px,6vw,40px); font-weight:800; line-height:1.05; }
h2{ font-size:22px; font-weight:700; }
h3{ font-size:18px; font-weight:700; }
.discret{ color:var(--brume); }
.petit{ font-size:14px; }
.chiffre{ font-family:var(--titre); font-weight:700; font-variant-numeric:tabular-nums; }

/* ---------- En-tête du jour ---------- */
.entete{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:8px 0 6px; }
.nav-jour{ display:flex; gap:6px; }
.rond{ width:42px; height:42px; border-radius:50%; border:1px solid var(--trait); background:var(--surface); display:grid; place-items:center; padding:0; }
.rond:disabled{ opacity:.4; cursor:default; }
.bandeau{ margin:10px 0 0; padding:10px 14px; border-radius:14px; background:var(--surface-2); font-size:14px; display:flex; gap:10px; align-items:center; }
.bandeau .ico{ width:20px; height:20px; color:var(--or); }

/* ---------- L'assiette ---------- */
.jour-grille{ display:grid; gap:18px; margin-top:18px; }
@media (min-width:960px){ .jour-grille{ grid-template-columns:340px 1fr; align-items:start; } .assiette-bloc{ position:sticky; top:34px; } }
.assiette-bloc{ background:var(--surface); border-radius:28px; padding:22px 20px 18px; box-shadow:var(--ombre); }
.assiette{ display:block; width:min(280px,78vw); height:auto; margin:0 auto; }
.assiette .arc{ transition:stroke-opacity .5s ease, stroke-width .5s ease; }
@media (prefers-reduced-motion:reduce){ .assiette .arc, body{ transition:none; } }
.jauges{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
.jauge{ text-align:center; }
.jauge .chiffre{ font-size:22px; display:block; line-height:1.1; }
.jauge .discret{ font-size:12px; }
.barre-prog{ height:6px; border-radius:6px; background:var(--surface-2); overflow:hidden; margin-top:6px; }
.barre-prog i{ display:block; height:100%; border-radius:6px; }

/* ---------- Repas ---------- */
.repas{ background:var(--surface); border-radius:18px; padding:16px 16px 12px 22px; position:relative; box-shadow:var(--ombre); }
.repas + .repas{ margin-top:12px; }
.repas::before{ content:""; position:absolute; left:0; top:14px; bottom:14px; width:6px; border-radius:0 6px 6px 0; background:var(--couleur); }
.repas.fait{ background:color-mix(in srgb, var(--couleur) 12%, var(--surface)); }
.repas-type{ font-size:13px; font-weight:700; color:var(--brume); }
.repas h3{ margin-top:2px; }
.pastille{ display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--titre-c); margin-top:6px; }
.pastille .ico{ width:13px; height:13px; }
.ingredients{ list-style:none; padding:0; margin:10px 0 8px; display:grid; grid-template-columns:1fr auto; column-gap:14px; row-gap:3px; font-size:15px; }
.ingredients li{ display:contents; }
.ingredients .q{ text-align:right; font-variant-numeric:tabular-nums; color:var(--brume); }
.repas-pied{ display:flex; align-items:center; justify-content:space-between; gap:8px; border-top:1px dashed var(--trait); padding-top:10px; flex-wrap:wrap; }
.repas-pied .infos{ display:flex; gap:14px; font-size:14px; }
.repas-pied .infos b{ font-family:var(--titre); }
.coche{ display:inline-flex; align-items:center; gap:8px; border:2px solid var(--couleur); background:transparent; border-radius:999px; padding:6px 14px 6px 8px; font-weight:700; font-size:14px; }
.coche .case{ width:22px; height:22px; border-radius:50%; border:2px solid var(--couleur); display:grid; place-items:center; }
.coche .case .ico{ width:14px; height:14px; opacity:0; stroke-width:3; }
.coche[aria-pressed="true"]{ background:var(--couleur); color:var(--surface); }
.coche[aria-pressed="true"] .case{ background:var(--surface); border-color:var(--surface); }
.coche[aria-pressed="true"] .case .ico{ opacity:1; stroke:var(--couleur); }
.lien{ background:none; border:0; color:var(--titre-c); text-decoration:underline; text-decoration-color:var(--or); text-underline-offset:3px; font-weight:700; padding:6px 4px; font-size:14px; }

/* ---------- Ajustement d'un repas ---------- */
.repas.edition{ outline:2px solid var(--or); }
.lignes-ed{ list-style:none; padding:0; margin:10px 0 6px; display:grid; gap:6px; }
.lignes-ed li{ display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center; }
.lignes-ed .nom-ed{ font-size:15px; }
.lignes-ed .ecart{ display:block; font-size:12px; color:var(--brume); }
.qte{ display:flex; align-items:center; gap:4px; }
.qte button,.suppr{ width:34px; height:34px; border-radius:50%; border:1px solid var(--trait); background:var(--surface); font-weight:700; font-size:18px; padding:0; line-height:1; }
.qte input{ width:64px; text-align:right; border:1px solid var(--trait); border-radius:10px; padding:6px 6px; background:var(--surface); font-size:15px; font-variant-numeric:tabular-nums; }
.qte .u{ font-size:13px; color:var(--brume); width:34px; }
.suppr{ color:var(--alerte); }
.ajout-ed{ display:grid; grid-template-columns:1fr auto; gap:8px; margin:8px 0 10px; }
.ajout-ed select{ border:1px solid var(--trait); background:var(--surface); border-radius:12px; padding:9px 10px; font-size:15px; color:var(--encre); }
.btns-ed{ display:flex; gap:8px; flex-wrap:wrap; }
.btns-ed .bouton{ padding:10px 16px; font-size:15px; }

/* ---------- Stock ---------- */
.stock-ligne{ display:grid; grid-template-columns:1fr auto auto auto 34px; gap:10px; align-items:baseline; padding:9px 4px; border-bottom:1px solid var(--trait); font-variant-numeric:tabular-nums; }
.stock-ligne .n{ text-align:right; min-width:68px; }
.stock-tete{ font-size:12px; font-weight:700; color:var(--brume); border-bottom:1px solid var(--trait); }
.manque{ color:var(--alerte); font-weight:700; }
.jeter{ width:34px; height:34px; border-radius:50%; border:1px solid var(--trait); background:var(--surface); padding:0; display:grid; place-items:center; color:var(--brume); align-self:center; }
.jeter .ico{ width:17px; height:17px; }
.jeter-form{ grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--surface-2); border-radius:12px; padding:10px 12px; font-size:14px; }
.jeter-form input{ width:90px; border:1px solid var(--trait); border-radius:10px; padding:6px 8px; background:var(--surface); font-size:15px; text-align:right; }
.jeter-form .bouton{ padding:8px 14px; font-size:14px; }
.pertes{ margin-top:18px; }
.pertes li{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; padding:6px 0; border-bottom:1px solid var(--trait); font-size:14px; }
.pertes ul{ list-style:none; padding:0; margin:6px 0 0; }

/* ---------- Boutons ---------- */
.bouton{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:14px; padding:13px 20px; font-weight:700; font-size:16px; background:var(--primaire); color:var(--sur-primaire); }
.bouton.or{ background:var(--or); color:#2C1810; }
.bouton.plein{ width:100%; }
.bouton.leger{ background:var(--surface-2); color:var(--titre-c); }
.bouton:disabled{ opacity:.5; cursor:default; }
.faim{ margin-top:18px; width:100%; justify-content:space-between; padding:18px 20px; border-radius:20px; font-size:18px; font-family:var(--titre); text-align:left; }
.faim small{ display:block; font-family:var(--texte); font-weight:500; font-size:13px; opacity:.85; }
.faim .ico{ width:30px; height:30px; }

/* ---------- Planning ---------- */
.cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:16px; }
.cal .jsem{ text-align:center; font-size:12px; font-weight:700; color:var(--brume); }
.case-j{ color:var(--encre); background:var(--surface); border:1px solid var(--trait); border-radius:14px; min-height:78px; padding:7px 4px; display:flex; flex-direction:column; align-items:center; gap:5px; }
.case-j.vide{ background:transparent; border-color:transparent; }
.case-j .num{ font-family:var(--titre); font-weight:700; font-size:18px; line-height:1; }
.case-j .barres{ display:flex; gap:2px; }
.case-j .barres i{ width:8px; height:5px; border-radius:3px; border:1.5px solid var(--c); }
.case-j .barres i.ok{ background:var(--c); }
.case-j .marques{ display:flex; gap:3px; height:14px; color:var(--or); }
.case-j .marques .ico{ width:14px; height:14px; }
.case-j .cout{ font-size:11px; color:var(--brume); font-variant-numeric:tabular-nums; }
.case-j[aria-current="date"]{ border:2px solid var(--or); }
.case-j.passe{ background:var(--surface-2); }
.legende{ display:flex; flex-wrap:wrap; gap:14px; margin-top:14px; font-size:13px; color:var(--brume); }
.legende span{ display:inline-flex; align-items:center; gap:6px; }
.legende .ico{ width:15px; height:15px; color:var(--or); }
.progress-plan{ margin-top:16px; background:var(--surface); border-radius:18px; padding:16px; }

/* ---------- Courses ---------- */
.segments{ display:grid; grid-template-columns:repeat(3,1fr); background:var(--surface-2); border-radius:16px; padding:4px; margin:16px 0; }
.segments button{ border:0; background:none; border-radius:12px; padding:10px 8px; font-weight:700; text-align:left; line-height:1.25; }
.segments button span{ display:block; font-weight:500; font-size:13px; color:var(--brume); }
.segments button[aria-pressed="true"]{ background:var(--surface); box-shadow:var(--ombre); }
.totaux{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.totaux div{ background:var(--surface); border-radius:16px; padding:12px; }
.totaux .chiffre{ font-size:20px; display:block; }
.totaux .discret{ font-size:12px; }
.champ{ display:flex; flex-direction:column; gap:4px; font-size:13px; font-weight:700; color:var(--brume); }
.champ input,.champ select{ border:1px solid var(--trait); background:var(--surface); border-radius:12px; padding:10px 12px; font-size:16px; color:var(--encre); font-weight:500; }
.cat-titre{ font-family:var(--titre); font-weight:700; font-size:16px; margin:22px 0 6px; color:var(--titre-c); }
.article{ display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; padding:10px 4px; border-bottom:1px solid var(--trait); cursor:pointer; -webkit-tap-highlight-color:transparent; }
.article .saisie{ cursor:default; }
.article .check{ width:28px; height:28px; border-radius:9px; border:2px solid var(--vert); background:var(--surface); display:grid; place-items:center; padding:0; }
:root[data-theme="dark"] .article .check{ border-color:var(--or); }
.article .check .ico{ width:16px; height:16px; opacity:0; stroke:var(--surface); stroke-width:3; }
.article .check[aria-pressed="true"]{ background:var(--vert); }
.article .check[aria-pressed="true"] .ico{ opacity:1; }
.article .nom{ font-weight:700; }
.article.achete .nom{ text-decoration:line-through; text-decoration-color:var(--brume); }
.article .detail{ font-size:13px; color:var(--brume); }
.article .prix{ text-align:right; font-variant-numeric:tabular-nums; font-weight:700; }
.article .prix span{ display:block; font-weight:500; font-size:12px; color:var(--brume); }
.article .saisie{ grid-column:2 / 4; display:flex; gap:8px; align-items:center; font-size:13px; color:var(--brume); }
.article .saisie input{ width:96px; border:1px solid var(--trait); border-radius:10px; padding:6px 8px; background:var(--surface); font-size:15px; }

/* ---------- Budget ---------- */
.carte{ background:var(--surface); border-radius:22px; padding:18px; box-shadow:var(--ombre); }
.carte + .carte{ margin-top:14px; }
.pot{ margin-top:16px; }
.pot-barre{ position:relative; height:26px; border-radius:13px; background:var(--surface-2); overflow:hidden; margin:14px 0 8px; }
.pot-barre i{ position:absolute; left:0; top:0; bottom:0; border-radius:13px; }
.pot-barre b{ position:absolute; top:-4px; bottom:-4px; width:3px; background:var(--encre); border-radius:2px; }
.stats{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:14px; }
@media (min-width:640px){ .stats{ grid-template-columns:repeat(4,1fr); } }
.stats div{ background:var(--surface-2); border-radius:16px; padding:12px; }
.stats .chiffre{ font-size:20px; display:block; }
.stats .discret{ font-size:12px; }
.courbe{ width:100%; height:auto; display:block; margin-top:10px; }
table.tab{ width:100%; border-collapse:collapse; font-size:14px; margin-top:8px; }
table.tab th{ text-align:left; font-weight:700; color:var(--brume); font-size:12px; padding:6px 4px; border-bottom:1px solid var(--trait); }
table.tab td{ padding:8px 4px; border-bottom:1px solid var(--trait); font-variant-numeric:tabular-nums; }
table.tab .n{ text-align:right; }
.eco{ color:var(--ok); font-weight:700; }
.surcout{ color:var(--alerte); font-weight:700; }

/* ---------- Profil ---------- */
.grille-2{ display:grid; gap:12px; margin-top:16px; }
.grille-2 .carte{ margin-top:0; }
@media (min-width:640px){ .grille-2{ grid-template-columns:1fr 1fr; } }
.puces{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.puce{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--trait); background:var(--surface); border-radius:999px; padding:6px 12px; font-size:14px; font-weight:700; }
.puce[aria-pressed="true"]{ background:var(--primaire); border-color:var(--primaire); color:var(--sur-primaire); }
.puce button{ border:0; background:none; padding:0 0 0 2px; font-weight:700; color:var(--brume); }
.ligne-saisie{ display:flex; gap:8px; margin-top:10px; align-items:flex-end; }
.ligne-saisie .champ{ flex:1; }
.etat-sync{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; }
.etat-sync i{ width:9px; height:9px; border-radius:50%; background:var(--or); }
.etat-sync.ok i{ background:var(--ok); }

/* ---------- Assistant ---------- */
.voile{ position:fixed; inset:0; background:rgba(16,56,42,.55); z-index:40; display:flex; align-items:flex-end; justify-content:center; }
.feuille-ia{ background:var(--fond); width:100%; max-width:660px; max-height:92vh; overflow:auto; border-radius:26px 26px 0 0; padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px)); }
@media (min-width:700px){ .voile{ align-items:center; } .feuille-ia{ border-radius:26px; } }
.feuille-ia .tete{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:12px; }
.form-ia{ display:grid; gap:16px; }
.form-ia .rangee{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.compteur{ display:flex; align-items:center; gap:10px; }
.compteur button{ width:40px; height:40px; border-radius:50%; border:1px solid var(--trait); background:var(--surface); font-size:20px; font-weight:700; padding:0; }
.compteur output{ font-family:var(--titre); font-weight:800; font-size:24px; min-width:28px; text-align:center; }
.interrupteur{ display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--surface); border-radius:14px; padding:12px 14px; cursor:pointer; }
.interrupteur b{ display:block; font-size:15px; }
.interrupteur small{ color:var(--brume); font-size:13px; }
.interrupteur .bascule{ width:46px; height:28px; border-radius:14px; background:var(--trait); position:relative; flex:none; transition:background .2s; }
.interrupteur .bascule::after{ content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--surface); transition:left .2s; box-shadow:0 1px 2px rgba(0,0,0,.2); }
.interrupteur[aria-checked="true"] .bascule{ background:var(--vert); }
:root[data-theme="dark"] .interrupteur[aria-checked="true"] .bascule{ background:var(--or); }
.interrupteur[aria-checked="true"] .bascule::after{ left:21px; }
.attente{ display:flex; align-items:center; gap:12px; padding:18px; background:var(--surface); border-radius:18px; margin-top:14px; }
.attente svg{ width:44px; height:44px; flex:none; }
.attente .vapeur{ animation:vapeur 1.6s ease-in-out infinite; }
.attente .vapeur:nth-child(2){ animation-delay:.3s; } .attente .vapeur:nth-child(3){ animation-delay:.6s; }
@keyframes vapeur{ 0%{ opacity:0; transform:translateY(4px);} 50%{opacity:1;} 100%{ opacity:0; transform:translateY(-6px);} }
@media (prefers-reduced-motion:reduce){ .attente .vapeur{ animation:none; } }
.propo{ background:var(--surface); border-radius:18px; padding:16px; margin-top:12px; border:2px solid transparent; }
.propo.alerte{ border-color:color-mix(in srgb, var(--alerte) 45%, transparent); }
.propo .chiffres{ display:flex; flex-wrap:wrap; gap:14px; font-size:14px; margin:8px 0; }
.propo .chiffres b{ font-family:var(--titre); }
.propo ol{ margin:8px 0 12px; padding-left:20px; font-size:14px; }
.etiquette{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; border-radius:999px; padding:3px 10px; }
.etiquette.stock{ background:color-mix(in srgb, var(--ok) 16%, var(--surface)); color:var(--ok); }
.etiquette.achat{ background:color-mix(in srgb, var(--or) 25%, var(--surface)); color:var(--titre-c); }
.etiquette.manque{ background:color-mix(in srgb, var(--alerte) 15%, var(--surface)); color:var(--alerte); }
.erreur{ background:color-mix(in srgb, var(--alerte) 12%, var(--surface)); border-radius:14px; padding:12px 14px; margin-top:12px; font-size:14px; }
.toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(90px + env(safe-area-inset-bottom,0px)); background:var(--primaire); color:var(--sur-primaire); padding:10px 16px; border-radius:12px; font-weight:700; font-size:14px; z-index:50; }
@media (min-width:960px){ .toast{ bottom:30px; } }
.sect-titre{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }

eauté » appelle Claude à la demande"},"rappels":{"preparerMoisJour":30,"coursesJ":-1},"personnes":{"nicolas":{"poids":85,"kcalMin":1850,"kcalMax":1950,"prot":110,"budget":180,"budgetJours":21},"aurelie":{"poids":70,"kcalMin":1350,"kcalMax":1450,"prot":85,"budget":170,"budgetJours":21}},"horsRepas":[{"a":"Café","parJour":{"nicolas":47.6}},{"a":"Eau (bouteilles 5 L)","parJour":{"nicolas":2,"aurelie":2}}]}};

/* ---------- Constantes ---------- */
const DEBUT = new Date(2026, 9, 1);

/* ---------- Outils de format ---------- */
const eur = n => (n == null || isNaN(n)) ? "—" : n.toLocaleString("fr-FR", { style: "currency", currency: "EUR" });
const nb = (n, d = 0) => (n == null || isNaN(n)) ? "—" : n.toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d });
const echap = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const nom = (p = actif) => PERSONNES[p].nom;
const de = (p = actif) => /^[AEÉIOU]/i.test(nom(p)) ? "d'" + nom(p) : "de " + nom(p);
function dateDuJour(j) { return new Date(2026, 9, j); }
function libelleJour(j) {
  const t = dateDuJour(j).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  return cap(t.replace(/^(\S+) 1 /, "$1 1er "));
}
function jourDuPlan() {
  const n = new Date(), t = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  return Math.min(Math.max(Math.floor((t - DEBUT) / 864e5) + 1, 1), NB_JOURS);
}
function planPasCommence() { return new Date() < DEBUT; }
function uniteDe(a) { if (UNITES_SPECIALES[a]) return UNITES_SPECIALES[a]; const n = DONNEES.nut[a]; return n ? n[1] : "g"; }
function quantite(a, q) {
  const u = uniteDe(a), r = Math.round(q * 10) / 10;
  if (a === "Œufs") return nb(r, r % 1 ? 1 : 0) + (r > 1 ? " œufs" : " œuf");
  if (a === "Wraps") return nb(r, r % 1 ? 1 : 0) + (r > 1 ? " wraps" : " wrap");
  if (a === "Pains burger") return nb(r, r % 1 ? 1 : 0) + (r > 1 ? " pains" : " pain");
  if (u === "g") return q >= 1000 ? nb(q / 1000, 2) + " kg" : nb(q) + " g";
  if (u === "ml") return q >= 1000 ? nb(q / 1000, 2) + " L" : nb(q) + " ml";
  if (u === "L") return nb(q) + " L";
  return nb(r, r % 1 ? 1 : 0) + " " + u;
}
const P = (p = actif) => E.personnes[p];

/* ---------- Thème clair / sombre ---------- */
function themeEffectif() {
  const t = document.documentElement.dataset.theme;
  if (t === "light" || t === "dark") return t;
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function boutonTheme() {
  const sombre = themeEffectif() === "dark";
  return `<button class="theme" data-action="theme" aria-label="${sombre ? "Passer en mode clair" : "Passer en mode sombre"}">${sombre ? ICONES.soleil : ICONES.lune}<span>${sombre ? "Clair" : "Sombre"}</span></button>`;
}

/* ---------- Prix, nutrition, coûts ---------- */
function fiche(a) { const c = DONNEES.cat[a]; if (!c) return null; const p = E.foyer.prix[a]; return p ? { ...c, prix: p.prix } : c; }
function prixUnitaire(a) { const c = fiche(a); if (!c || c.prix == null) return null; return c.vrac ? c.prix / 1000 / (c.rend || 1) : c.prix / c.cond; }
function nutrition(a, q) { const n = DONNEES.nut[a]; if (!n) return null; return { kcal: q / n[0] * n[2], prot: q / n[0] * n[3] }; }
function repasPlan(j, k, p = actif) {
  const m = DONNEES.plan[j - 1].meals.find(x => x.k === k);
  return { k, label: m.label, plat: m.plat[p], items: m.items[p] };
}
function repasDe(j, k, p = actif) {
  const r = P(p).remplacements["d" + j + "-" + k];
  return r || repasPlan(j, k, p);
}
function statsRepas(m) {
  let kcal = 0, prot = 0, cout = 0, inconnu = false;
  for (const [a, q] of m.items) {
    const n = nutrition(a, q); if (n) { kcal += n.kcal; prot += n.prot; }
    const pu = prixUnitaire(a); if (pu == null) inconnu = true; else cout += pu * q;
  }
  return { kcal, prot, cout, inconnu };
}
function horsRepasJour(p = actif) { return HORS_REPAS[p].reduce((s, h) => s + (prixUnitaire(h.a) || 0) * h.q, 0) / NB_JOURS; }
function statsJour(j, p = actif) {
  const r = { kcal: 0, prot: 0, cout: 0, kcalFait: 0, coutFait: 0, faits: 0 };
  for (const k of CLES) {
    const s = statsRepas(repasDe(j, k, p)), f = !!P(p).coches["d" + j + "-" + k];
    r.kcal += s.kcal; r.prot += s.prot; r.cout += s.cout;
    if (f) { r.kcalFait += s.kcal; r.coutFait += s.cout; r.faits++; }
  }
  return r;
}
function totalPrevu(p = actif) { let t = 0; for (let j = 1; j <= NB_JOURS; j++) t += statsJour(j, p).cout; return t + horsRepasJour(p) * NB_JOURS; }

/* ---------- Stock estimé du foyer ---------- */
function quantiteUtile(it) { const c = DONNEES.cat[it.a]; return c.vrac ? it.buy * (c.rend || 1) : it.buy * c.cond; }
// Stock au matin du jour j (j = 22 : fin du cycle). planSeul = sans les ajustements ni remplacements.
function stockBrut(j, planSeul = false) {
  const s = {};
  for (const [a, c] of Object.entries(DONNEES.cat)) if (c.stock) s[a] = c.stock;
  for (const c of DONNEES.courses) if (c.jourPlan <= j) for (const it of c.items) s[it.a] = (s[it.a] || 0) + quantiteUtile(it);
  for (let d = 1; d < j && d <= NB_JOURS; d++) for (const p of Object.keys(PERSONNES)) for (const k of CLES)
    for (const [a, q] of (planSeul ? repasPlan(d, k, p) : repasDe(d, k, p)).items) s[a] = (s[a] || 0) - q;
  // produits jetés (poubelle de l'onglet « À la maison ») : retirés à partir du jour où ils l'ont été
  if (!planSeul) for (const x of E.foyer.pertes || []) if (x.j <= j) s[x.a] = (s[x.a] || 0) - x.q;
  return s;
}
function stockAuDebut(j) {
  const s = stockBrut(j);
  for (const a of Object.keys(s)) if (s[a] <= 0.5) delete s[a];
  return s;
}

/* ---------- Courses ---------- */
function texteAchat(it) { const c = DONNEES.cat[it.a]; return c.vrac ? quantite(it.a, it.buy) + " en vrac" : it.buy + " × " + c.achat; }
function estimationLigne(it) { const c = fiche(it.a); if (!c || c.prix == null) return null; return c.vrac ? it.buy / 1000 * c.prix : it.buy * c.prix; }
function cleArticle(cid, a) { return "c" + cid + "-" + a; }
function part(a, p = actif) { const s = DONNEES.share[a]; const n = s == null ? 0.5 : s; return p === "nicolas" ? n : 1 - n; }
function bilanCourse(cid, p = actif) {
  const c = DONNEES.courses.find(x => x.id === cid);
  let est = 0, maPart = 0, paye = 0, partPaye = 0, faits = 0;
  for (const it of c.items) {
    const e = estimationLigne(it) || 0; est += e; maPart += e * part(it.a, p);
    const k = cleArticle(cid, it.a); if (E.foyer.achats[k]) faits++;
    const v = E.foyer.payes[k]; if (v != null && v !== "") { paye += +v; partPaye += (+v) * part(it.a, p); }
  }
  return { est, maPart, paye, partPaye, faits, total: c.items.length };
}

/* ---------- Sauvegarde : compte Claude puis appareil ---------- */
let minuterie = null, enCours = false, encore = false;
function charger(obj) {
  if (!obj || typeof obj !== "object") return;
  if (!obj.version) { // migration depuis la première version (Nicolas seul)
    const n = E.personnes.nicolas;
    if (obj.coches) n.coches = obj.coches;
    if (obj.remplacements) n.remplacements = obj.remplacements;
    if (obj.pesees) n.pesees = obj.pesees;
    if (obj.profil) n.profil = { ...n.profil, ...obj.profil };
    for (const k of ["achats", "payes", "prix", "magasins"]) if (obj[k]) E.foyer[k] = obj[k];
    return;
  }
  E.foyer = { ...structuredClone(DEFAUT.foyer), ...(obj.foyer || {}) };
  for (const p of Object.keys(PERSONNES)) {
    const src = (obj.personnes || {})[p] || {}, d = structuredClone(DEFAUT.personnes[p]);
    E.personnes[p] = { ...d, ...src, profil: { ...d.profil, ...(src.profil || {}) } };
  }
}
try { const l = localStorage.getItem("marmite-nicolas"); if (l) charger(JSON.parse(l)); } catch (e) {}
function sauver() {
  try { localStorage.setItem("marmite-nicolas", JSON.stringify(E)); } catch (e) {}
  clearTimeout(minuterie); minuterie = setTimeout(envoyer, 800);
}
async function envoyer() {
  if (!refDoc) return;
  if (enCours) { encore = true; return; }
  enCours = true;
  try { await refDoc.set(JSON.parse(JSON.stringify(E))); sync = "compte"; } catch (e) { sync = "hors-ligne"; }
  enCours = false;
  if (encore) { encore = false; envoyer(); }
}
async function brancherCompte() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    refDoc = db.doc("data/users/" + id + "/marmite");
    const snap = await refDoc.get();
    if (snap.exists) { charger(snap.data()); try { localStorage.setItem("marmite-nicolas", JSON.stringify(E)); } catch (e) {} }
    E.version = 2;
    await refDoc.set(JSON.parse(JSON.stringify(E)));
    sync = "compte"; rendre();
  } catch (e) { sync = "hors-ligne"; rendre(); }
}

function aller(k) { vue = k; edition = null; rendre(); document.getElementById("vue").focus({ preventScroll: true }); window.scrollTo(0, 0); }

/* ---------- Vue : jour ---------- */
function assietteSVG(j) {
  const R = 100, C = 2 * Math.PI * R, ecart = 5;
  const parts = CLES.map(k => ({ k, s: statsRepas(repasDe(j, k)), f: !!P().coches["d" + j + "-" + k] }));
  const tot = parts.reduce((s, x) => s + x.s.kcal, 0) || 1;
  let off = 0, arcs = "";
  for (const x of parts) {
    const len = Math.max(C * x.s.kcal / tot - ecart, 2);
    arcs += `<circle class="arc" cx="130" cy="130" r="${R}" fill="none" style="stroke:${COULEUR[x.k]}" stroke-width="${x.f ? 30 : 22}" stroke-opacity="${x.f ? 1 : .3}" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 130 130)"/>`;
    off += C * x.s.kcal / tot;
  }
  const st = statsJour(j);
  return `<svg class="assiette" viewBox="0 0 260 260" role="img" aria-label="Assiette du jour : ${nb(st.kcalFait)} kcal mangées sur ${nb(st.kcal)} prévues">

    <text x="130" y="170" text-anchor="middle" style="font:700 14px var(--texte);fill:var(--or)">${st.faits}/4 repas</text></svg>`;
}
function vueJour() {
  const j = jourSel, jour = DONNEES.plan[j - 1], st = statsJour(j), pr = P().profil;
  let b = "";
  if (planPasCommence() && j === 1) b += `<p class="bandeau">${ICONES.info}Le planning démarre le jeudi 1er octobre. Voici la première journée.</p>`;

  <div class="jour-grille">
    <section class="assiette-bloc" aria-label="Bilan du jour">${assietteSVG(j)}

        <div class="jauge"><span class="chiffre">${nb(st.prot)} g</span><span class="discret">protéines</span><div class="barre-prog"><i style="width:${pp}%;background:var(--c-dej)"></i></div></div>
        <div class="jauge"><span class="chiffre">${eur(st.cout)}</span><span class="discret">repas du jour</span><div class="barre-prog"><i style="width:100%;background:var(--c-din)"></i></div></div>
      </div>
      <p class="discret petit" style="margin:12px 0 0;text-align:center">Hors repas (café, eau) : ${eur(horsRepasJour())} par jour. Objectif : ${nb(pr.kcalMin)} à ${nb(pr.kcalMax)} kcal, ${nb(pr.prot)} g de protéines.</p>
    </section>
    <section aria-label="Repas du jour">${CLES.map(k => ticketRepas(j, k)).join("")}

    </section>

}
function ecartTexte(m, j, k) {

  return `${sg(dk)}${nb(Math.abs(dk))} kcal, ${sg(dc)}${eur(Math.abs(dc))}`;
}
let edition = null; // { j, k, items } : repas en cours d'ajustement
const PAS = u => u === "ml" ? 10 : u === "unité" ? 1 : 5;
function optionsAjout() {
  const g = {};

function infosEdition() {

function ticketEdition(j, k) {

function ticketRepas(j, k) {

/* ---------- Vue : planning ---------- */
function vuePlanning() {
  const auj = jourDuPlan(), commence = !planPasCommence();
  let cases = ["lun.", "mar.", "mer.", "jeu.", "ven.", "sam.", "dim."].map(d => `<div class="jsem">${d}</div>`).join("");
  const decal = (dateDuJour(1).getDay() + 6) % 7;
  for (let i = 0; i < decal; i++) cases += `<div class="case-j vide" aria-hidden="true"></div>`;
  let faits = 0;
  for (let j = 1; j <= NB_JOURS; j++) {
    const jour = DONNEES.plan[j - 1], st = statsJour(j); faits += st.faits;
    const barres = CLES.map(k => `<i style="--c:${COULEUR[k]}" class="${P().coches["d" + j + "-" + k] ? "ok" : ""}"></i>`).join("");

    <div class="barre-prog" style="height:10px"><i style="width:${faits / total * 100}%;background:var(--c-dej)"></i></div></div>
  <div class="cal">${cases}</div>
  <div class="legende"><span>${ICONES.etoile}Repas plaisir</span><span>${ICONES.poisson}Poisson</span><span>${ICONES.panier}Jour de courses</span></div>`;
}

/* ---------- Vue : courses ---------- */
function vueStock(seg) {
  const jNow = planPasCommence() ? 1 : jourDuPlan();
  const now = stockBrut(jNow), fin = stockBrut(NB_JOURS + 1), finPlan = stockBrut(NB_JOURS + 1, true);
  const alim = Object.keys(DONNEES.nut).filter(a => DONNEES.cat[a] && (now[a] != null || fin[a] != null));
  let manques = 0, valeurEcart = 0;
  const lignes = alim.map(a => {
    const f = fin[a] || 0, fp = finPlan[a] || 0, ec = f - fp, pu = prixUnitaire(a) || 0;
    if (f < -0.5) manques++; valeurEcart += ec * pu;
    return { a, n: Math.max(0, now[a] || 0), f, ec };
  }).sort((x, y) => (x.f < -0.5 ? x.f : 0) - (y.f < -0.5 ? y.f : 0) || Math.abs(y.ec) - Math.abs(x.ec) || x.a.localeCompare(y.a, "fr"));
  const sg = (x, a) => Math.abs(x) < 0.5 ? "=" : (x > 0 ? "+" : "−") + quantite(a, Math.abs(x));
  let adj = 0, dk = 0, dc = 0;
  for (let j = 1; j <= NB_JOURS; j++) for (const k of CLES) { const r = P().remplacements["d" + j + "-" + k]; if (r && r.ajuste) { adj++; const x = statsRepas(r), y = statsRepas(repasPlan(j, k)); dk += x.kcal - y.kcal; dc += x.cout - y.cout; } }
  return `<h1>Courses du foyer</h1>
  <div class="segments" role="group" aria-label="Choisir la liste">${seg}</div>
  <div class="totaux">
    <div><span class="chiffre ${manques ? "surcout" : "eco"}">${manques}</span><span class="discret">aliment${manques > 1 ? "s" : ""} en rupture avant le 21</span></div>
    <div><span class="chiffre ${valeurEcart < 0 ? "surcout" : "eco"}">${valeurEcart < 0 ? "−" : "+"}${eur(Math.abs(valeurEcart))}</span><span class="discret">stock en fin de cycle vs plan</span></div>
    <div><span class="chiffre">${adj}</span><span class="discret">repas ajustés ${de()} (${dk >= 0 ? "+" : "−"}${nb(Math.abs(dk))} kcal)</span></div>
  </div>
  <p class="discret petit">Stock estimé du foyer : achats des courses, moins ce que vous avez mangé selon le planning et vos ajustements. Écart = différence avec le planning d'origine en fin de cycle.</p>
  <div class="stock-ligne stock-tete"><span>Aliment</span><span class="n">${planPasCommence() ? "Au 1er oct." : "Ce matin"}</span><span class="n">Le 21 au soir</span><span class="n">Écart</span><span></span></div>
  ${lignes.map(l => `<div class="stock-ligne"><span>${echap(l.a)}</span><span class="n">${quantite(l.a, l.n)}</span>
    <span class="n ${l.f < -0.5 ? "manque" : ""}">${l.f < -0.5 ? "manque " + quantite(l.a, -l.f) : quantite(l.a, Math.max(0, l.f))}</span>
    <span class="n ${l.ec < -0.5 ? "surcout" : l.ec > 0.5 ? "eco" : "discret"}">${sg(l.ec, l.a)}</span>
    ${l.n > 0.5 ? `<button class="jeter" data-jeter="${echap(l.a)}" aria-label="Jeter du stock : ${echap(l.a)}">${ICONES.poubelle}</button>` : "<span></span>"}
    ${jeterSel === l.a ? `<div class="jeter-form"><label>Jeter <input id="jeter-q" type="number" inputmode="decimal" min="0" step="any" value="${Math.round(l.n * 10) / 10}"> ${uniteDe(l.a)}</label>
      <button class="bouton" data-jeter-ok="${echap(l.a)}">Mettre à la poubelle</button><button class="bouton leger" data-jeter-annuler="1">Annuler</button></div>` : ""}</div>`).join("")}
  ${vuePertes()}`;
}

/* ---------- Vue : budget ---------- */
function vueBudget() {
  const pr = P().profil, prevu = totalPrevu(), budget = +pr.budget || 0, ref = +pr.reference || 0;
  const auj = planPasCommence() ? 0 : jourDuPlan();
  let consomme = 0; for (let j = 1; j <= NB_JOURS; j++) consomme += statsJour(j).coutFait;
  consomme += horsRepasJour() * auj;
  const b1 = bilanCourse(1), b2 = bilanCourse(2), partPaye = b1.partPaye + b2.partPaye;
  const depasse = prevu > budget, maxi = Math.max(budget, prevu) || 1;
  const W = Math.round(Math.min(Math.max(window.innerWidth - 90, 300), 860)), H = 200, pad = 28, top = maxi * 1.05;
  let cum = 0; const pts = [], ptsF = [];
  for (let j = 1; j <= NB_JOURS; j++) {
    const s = statsJour(j); cum += s.cout + horsRepasJour();
    const x = pad + (j - 1) / (NB_JOURS - 1) * (W - 2 * pad), y = H - pad - cum / top * (H - 2 * pad);
    pts.push([x, y]); if (s.faits === 4) ptsF.push([x, y]);
  }
  const yB = H - pad - budget / top * (H - 2 * pad);
  const courbe = `<svg class="courbe" viewBox="0 0 ${W} ${H}" role="img" aria-label="Dépense prévue cumulée comparée au budget">
    <line x1="${pad}" y1="${H - pad}" x2="${W - pad}" y2="${yB}" style="stroke:var(--brume)" stroke-width="2" stroke-dasharray="6 6"/>
    <polyline points="${pts.map(q => q.join(",")).join(" ")}" fill="none" style="stroke:var(--c-dej)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    ${ptsF.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="5" style="fill:var(--or)"/>`).join("")}
    <text x="${W - pad}" y="${yB - 8}" text-anchor="end" style="font:13px var(--texte);fill:var(--brume)">Budget ${eur(budget)}</text>
    <text x="${pad}" y="${H - 6}" style="font:12px var(--texte);fill:var(--brume)">1er oct.</text>
    <text x="${W - pad}" y="${H - 6}" text-anchor="end" style="font:12px var(--texte);fill:var(--brume)">21 oct.</text></svg>`;
  const ecarts = [];
  for (const c of DONNEES.courses) for (const it of c.items) {
    const v = E.foyer.payes[cleArticle(c.id, it.a)]; if (v == null || v === "") continue;
    const base = DONNEES.cat[it.a]; if (base.prix == null) continue;
    const estBase = base.vrac ? it.buy / 1000 * base.prix : it.buy * base.prix;
    ecarts.push({ a: it.a, c: c.titre, est: estBase, paye: +v, part: part(it.a) });
  }
  const ecoReelle = ecarts.reduce((s, e) => s + (e.est - e.paye) * e.part, 0);
  const lignes = ecarts.length ? ecarts.map(e => { const d = (e.est - e.paye) * e.part;
    return `<tr><td>${echap(e.a)}<br><span class="discret petit">${e.c}</span></td><td class="n">${eur(e.est)}</td><td class="n">${eur(e.paye)}</td><td class="n ${d >= 0 ? "eco" : "surcout"}">${d >= 0 ? "−" : "+"}${eur(Math.abs(d))}</td></tr>`; }).join("")
    : `<tr><td colspan="4" class="discret">Aucun prix saisi pour l'instant. Note les prix dans Courses pour suivre les vraies économies.</td></tr>`;
  return `<h1>Budget ${de()}</h1>
  <p class="discret" style="margin:6px 0 0">Sa part du 1er au 21 octobre : ce qui est mangé, au prix réel dès qu'il est noté.</p>
  <section class="carte pot">
    <div class="sect-titre" style="flex-wrap:wrap"><h2>${eur(prevu)} prévus</h2><span class="${depasse ? "surcout" : "eco"}">${depasse ? "Au-dessus du budget de " + eur(prevu - budget) : "Sous le budget de " + eur(budget - prevu)}</span></div>
    <div class="pot-barre"><i style="width:${Math.min(prevu / maxi, 1) * 100}%;background:${depasse ? "var(--alerte)" : "var(--or)"}"></i><b style="left:calc(${Math.min(budget / maxi, 1) * 100}% - 2px)"></b></div>
    <p class="discret petit" style="margin:0">Budget fixé : ${eur(budget)}, modifiable dans Profil</p>
    <div class="stats">
      <div><span class="chiffre">${eur(consomme)}</span><span class="discret">déjà consommé</span></div>
      <div><span class="chiffre">${eur(prevu - consomme)}</span><span class="discret">reste à manger</span></div>
      <div><span class="chiffre">${eur(partPaye)}</span><span class="discret">sa part payée</span></div>
      <div><span class="chiffre eco">${eur(ref - prevu)}</span><span class="discret">économisé vs liste initiale</span></div>

function choisir(i) {

function memeItems(a, b) {

function actionEdition(d) {

  if (!edition) return;
  const i = +d.i, it = edition.items[i];
  switch (d.ed) {
    case "moins": it[1] = Math.max(0, Math.round((it[1] - PAS(uniteDe(it[0]))) * 10) / 10); break;
    case "plus": it[1] = Math.round((it[1] + PAS(uniteDe(it[0]))) * 10) / 10; break;
    case "suppr": edition.items.splice(i, 1); break;
    case "ajouter": {
      const a = document.getElementById("ed-ajout").value, u = uniteDe(a);
      const ex = edition.items.find(x => x[0] === a);

  if (d.voir) { jourSel = +d.voir; return aller("jour"); }
  if (d.coche) { const c = P().coches; c[d.coche] ? delete c[d.coche] : (c[d.coche] = true); sauver(); return rendre(); }
  if (d.course) { courseSel = d.course === "stock" ? "stock" : +d.course; jeterSel = null; return rendre(); }
  if (d.jeter) { jeterSel = jeterSel === d.jeter ? null : d.jeter; rendre(); const i = document.getElementById("jeter-q"); if (i) i.focus(); return; }
  if (d.jeterAnnuler) { jeterSel = null; return rendre(); }
  if (d.jeterOk) {
    const q = parseFloat((document.getElementById("jeter-q") || {}).value);
    if (q > 0) {
      const j = planPasCommence() ? 1 : jourDuPlan();
      E.foyer.pertes = (E.foyer.pertes || []).concat({ j, a: d.jeterOk, q, date: new Date().toISOString().slice(0, 10) });
      sauver(); toast(d.jeterOk + " : " + quantite(d.jeterOk, q) + " à la poubelle");
    }
    jeterSel = null; return rendre();
  }
  if (d.perteSuppr) { E.foyer.pertes.splice(+d.perteSuppr, 1); sauver(); return rendre(); }
  if (d.achat) { const a = E.foyer.achats; a[d.achat] ? delete a[d.achat] : (a[d.achat] = true); sauver(); return rendre(); }
  if (d.ia) return ouvrirIA(d.ia);
  if (d.retour) { delete P().remplacements["d" + jourSel + "-" + d.retour]; sauver(); rendre(); return toast("Repas du plan rétabli"); }
  if (d.envie) { lireForm(); ia.envie = d.envie; return rendreIA(); }
  if (d.choisir) return choisir(+d.choisir);
  if (d.retirer) { P().profil.eviter.splice(+d.retirer, 1); sauver(); return rendre(); }
  switch (d.action) {
    case "theme": {
      const t = themeEffectif() === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = t; try { localStorage.setItem("marmite-theme", t); } catch (e) {}
      rendre(); if (ia) rendreIA(); return;
    }
    case "fermer": return fermerIA();
    case "proposer": return proposer();
    case "relancer": ia.etat = "form"; ia.propositions = []; return rendreIA();
    case "moins": lireForm(); ia.convives = Math.max(1, ia.convives - 1); return rendreIA();
    case "plus": lireForm(); ia.convives = Math.min(12, ia.convives + 1); return rendreIA();
    case "avec-autre": lireForm(); ia.avecAutre = !ia.avecAutre; return rendreIA();
    case "acheter": lireForm(); ia.acheter = !ia.acheter; return rendreIA();
    case "budget": lireForm(); ia.budgetActif = !ia.budgetActif; return rendreIA();
    case "pesee": {
      const v = parseFloat(document.getElementById("pesee").value);
      if (isNaN(v) || v < 30 || v > 250) return toast("Poids non valide");
      const auj = new Date().toISOString().slice(0, 10);
      P().pesees = P().pesees.filter(x => x.date !== auj).concat([{ date: auj, kg: v }]); sauver(); rendre(); return toast("Pesée enregistrée");
    }
    case "eviter": { const v = document.getElementById("ajout-eviter").value.trim(); if (!v) return; P().profil.eviter.push(v); sauver(); return rendre(); }
    case "reset":
      if (confirm("Effacer les coches, remplacements et pesées " + de() + " ?")) { E.personnes[actif] = structuredClone(DEFAUT.personnes[actif]); sauver(); rendre(); toast("Suivi remis à zéro"); }
      return;
  }
}
document.addEventListener("click", e => {
  const v = e.target.closest(".voile"); if (v && e.target === v) return fermerIA();
  const b = e.target.closest("button, .interrupteur"); if (b) return action(b);
  // liste de courses : toucher n'importe où sur la ligne coche l'article (sauf le champ « Prix payé »)
  const art = e.target.closest(".article"); if (art && !e.target.closest(".saisie")) { const c = art.querySelector("button.check"); if (c) action(c); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && ia) return fermerIA();
  const t = e.target; if ((e.key === " " || e.key === "Enter") && t.classList && t.classList.contains("interrupteur")) { e.preventDefault(); action(t); }
});
document.addEventListener("input", e => {
  const t = e.target; if (t.dataset.edQ == null || !edition) return;
  const v = parseFloat(t.value); edition.items[+t.dataset.edQ][1] = isNaN(v) ? 0 : Math.max(0, v);
  const inf = document.getElementById("ed-infos"); if (inf) inf.innerHTML = infosEdition();
});
document.addEventListener("change", e => {
  const t = e.target, d = t.dataset;
  if (d.paye) {
    const v = t.value === "" ? null : Math.max(0, parseFloat(t.value));
    if (v == null || isNaN(v)) delete E.foyer.payes[d.paye];
    else {
      E.foyer.payes[d.paye] = Math.round(v * 100) / 100;
      const c = DONNEES.cat[d.art], buy = +d.buy;
      if (c && buy > 0) E.foyer.prix[d.art] = { prix: c.vrac ? v / (buy / 1000) : v / buy, date: new Date().toISOString().slice(0, 10) };
    }
    sauver(); return rendre();
  }
  if (d.magasin) { E.foyer.magasins[d.magasin] = t.value.trim(); return sauver(); }
  if (d.profil) { const v = parseFloat(t.value); if (!isNaN(v)) { P().profil[d.profil] = v; sauver(); rendre(); } }
});
let minuterieTaille = null;
window.addEventListener("resize", () => { if (vue !== "budget") return; clearTimeout(minuterieTaille); minuterieTaille = setTimeout(rendre, 200); });
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => rendreCadre());

/* ---------- Démarrage ---------- */
rendre();
brancherCompte();
</script>
</body>
