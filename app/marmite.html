<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marmite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<script>
/* Thème choisi sur cet appareil, appliqué avant l'affichage */
try { const t = localStorage.getItem("marmite-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/* ---------- Palette Fluent & Forward ---------- */
:root{
  --vert:#1B6B4A; --profond:#10382A; --or:#C9A96E; --sable:#E8DDD0; --creme:#FAF7F2; --encre-ff:#2C1810;
  --fond:var(--creme); --surface:#FFFFFF; --surface-2:#F2EBE0; --trait:#E8DDD0; --encre:var(--encre-ff); --brume:#7A6A5E;
  --primaire:var(--vert); --sur-primaire:#FAF7F2; --accent:var(--or); --titre-c:var(--profond);
  --c-pdj:#C9A96E; --c-dej:#1B6B4A; --c-din:#5E9C7F; --c-des:#9C7A45;
  --alerte:#A2412B; --ok:#1B6B4A; --ombre:0 1px 0 rgba(44,24,16,.06);
  --titre:"Plus Jakarta Sans", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --texte:"DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fond:#10382A; --surface:#15432F; --surface-2:#1C5039; --trait:#2A614A; --encre:#FAF7F2; --brume:#CDBFAE;
    --primaire:#C9A96E; --sur-primaire:#10382A; --titre-c:#FAF7F2;
    --c-pdj:#C9A96E; --c-dej:#6FB896; --c-din:#A8D5BF; --c-des:#E3C893;
    --alerte:#F0A089; --ok:#8FD1AF; --ombre:0 1px 0 rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --fond:#10382A; --surface:#15432F; --surface-2:#1C5039; --trait:#2A614A; --encre:#FAF7F2; --brume:#CDBFAE;
  --primaire:#C9A96E; --sur-primaire:#10382A; --titre-c:#FAF7F2;
  --c-pdj:#C9A96E; --c-dej:#6FB896; --c-din:#A8D5BF; --c-des:#E3C893;
  --alerte:#F0A089; --ok:#8FD1AF; --ombre:0 1px 0 rgba(0,0,0,.25);
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; min-height:100%; background:var(--fond); color:var(--encre); font:16px/1.5 var(--texte); -webkit-font-smoothing:antialiased; transition:background .25s; }
button,input,select{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--or); outline-offset:2px; border-radius:6px; }
svg{ max-width:100%; }
.ico{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; flex:none; }

/* ---------- Mise en page ---------- */
.app{ display:grid; min-height:100vh; }
.app > div, main{ min-width:0; }
.rail{ display:none; }
.hautbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 18px 0; max-width:760px; margin:0 auto; }
main{ padding:14px 18px 110px; max-width:760px; width:100%; margin:0 auto; }
.barre{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--trait);
  display:grid; grid-template-columns:repeat(5,1fr); padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px)); }
.barre button,.rail .nav button{ background:none; border:0; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px;
  font-size:12px; font-weight:700; color:var(--brume); border-radius:12px; }
.barre button[aria-current="page"],.rail .nav button[aria-current="page"]{ color:var(--titre-c); }
.barre button[aria-current="page"] .ico{ stroke:var(--or); }
@media (min-width:960px){
  .app{ grid-template-columns:232px 1fr; }
  .barre,.hautbar{ display:none; }
  .rail{ display:flex; flex-direction:column; gap:18px; position:sticky; top:0; height:100vh; padding:28px 16px; background:var(--surface); border-right:1px solid var(--trait); }
  .rail .nav{ display:flex; flex-direction:column; gap:4px; }
  .rail .nav button{ flex-direction:row; gap:12px; font-size:15px; padding:10px 12px; justify-content:flex-start; }
  .rail .nav button[aria-current="page"]{ background:var(--surface-2); }
  .rail .bas{ margin-top:auto; }
  main{ padding:34px 40px 60px; max-width:1060px; }
}
.marque{ font-family:var(--titre); font-weight:800; font-size:22px; letter-spacing:-.02em; color:var(--titre-c); display:flex; align-items:center; gap:8px; }
.marque svg{ width:28px; height:28px; flex:none; }
@media (max-width:400px){ .hautbar{ padding:12px 16px 0; gap:6px; } .hautbar .marque{ font-size:18px; gap:5px; } .hautbar .marque svg{ width:22px; height:22px; } .qui button{ padding:6px 9px; font-size:13px; } .hautbar .theme{ padding:7px 9px; } }
.qui{ display:grid; grid-template-columns:1fr 1fr; background:var(--surface-2); border-radius:999px; padding:3px; }
.qui button{ border:0; background:none; border-radius:999px; padding:6px 12px; font-weight:700; font-size:14px; color:var(--brume); }
.qui button[aria-pressed="true"]{ background:var(--primaire); color:var(--sur-primaire); }
.theme{ display:inline-flex; align-items:center; gap:8px; border:1px solid var(--trait); background:var(--surface); border-radius:999px; padding:7px 12px; font-weight:700; font-size:14px; }
.theme .ico{ width:18px; height:18px; }
.hautbar .theme span{ display:none; }
@media (min-width:420px){ .hautbar .theme span{ display:inline; } }

/* ---------- Typographie ---------- */
h1,h2,h3{ font-family:var(--titre); letter-spacing:-.015em; margin:0; color:var(--titre-c); }
h1{ font-size:clamp(28px,6vw,40px); font-weight:800; line-height:1.05; }
h2{ font-size:22px; font-weight:700; }
h3{ font-size:18px; font-weight:700; }
.discret{ color:var(--brume); }
.petit{ font-size:14px; }
.chiffre{ font-family:var(--titre); font-weight:700; font-variant-numeric:tabular-nums; }

/* ---------- En-tête du jour ---------- */
.entete{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:8px 0 6px; }
.nav-jour{ display:flex; gap:6px; }
.rond{ width:42px; height:42px; border-radius:50%; border:1px solid var(--trait); background:var(--surface); display:grid; place-items:center; padding:0; }
.rond:disabled{ opacity:.4; cursor:default; }
.bandeau{ margin:10px 0 0; padding:10px 14px; border-radius:14px; background:var(--surface-2); font-size:14px; display:flex; gap:10px; align-items:center; }
.bandeau .ico{ width:20px; height:20px; color:var(--or); }

/* ---------- L'assiette ---------- */
.jour-grille{ display:grid; gap:18px; margin-top:18px; }
@media (min-width:960px){ .jour-grille{ grid-template-columns:340px 1fr; align-items:start; } .assiette-bloc{ position:sticky; top:34px; } }
.assiette-bloc{ background:var(--surface); border-radius:28px; padding:22px 20px 18px; box-shadow:var(--ombre); }
.assiette{ display:block; width:min(280px,78vw); height:auto; margin:0 auto; }
.assiette .arc{ transition:stroke-opacity .5s ease, stroke-width .5s ease; }
@media (prefers-reduced-motion:reduce){ .assiette .arc, body{ transition:none; } }
.jauges{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
.jauge{ text-align:center; }
.jauge .chiffre{ font-size:22px; display:block; line-height:1.1; }
.jauge .discret{ font-size:12px; }
.barre-prog{ height:6px; border-radius:6px; background:var(--surface-2); overflow:hidden; margin-top:6px; }
.barre-prog i{ display:block; height:100%; border-radius:6px; }

/* ---------- Repas ---------- */
.repas{ background:var(--surface); border-radius:18px; padding:16px 16px 12px 22px; position:relative; box-shadow:var(--ombre); }
.repas + .repas{ margin-top:12px; }
.repas::before{ content:""; position:absolute; left:0; top:14px; bottom:14px; width:6px; border-radius:0 6px 6px 0; background:var(--couleur); }
.repas.fait{ background:color-mix(in srgb, var(--couleur) 12%, var(--surface)); }
.repas-type{ font-size:13px; font-weight:700; color:var(--brume); }
.repas h3{ margin-top:2px; }
.pastille{ display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--titre-c); margin-top:6px; }
.pastille .ico{ width:13px; height:13px; }
.ingredients{ list-style:none; padding:0; margin:10px 0 8px; display:grid; grid-template-columns:1fr auto; column-gap:14px; row-gap:3px; font-size:15px; }
.ingredients li{ display:contents; }
.ingredients .q{ text-align:right; font-variant-numeric:tabular-nums; color:var(--brume); }
.repas-pied{ display:flex; align-items:center; justify-content:space-between; gap:8px; border-top:1px dashed var(--trait); padding-top:10px; flex-wrap:wrap; }
.repas-pied .infos{ display:flex; gap:14px; font-size:14px; }
.repas-pied .infos b{ font-family:var(--titre); }
.coche{ display:inline-flex; align-items:center; gap:8px; border:2px solid var(--couleur); background:transparent; border-radius:999px; padding:6px 14px 6px 8px; font-weight:700; font-size:14px; }
.coche .case{ width:22px; height:22px; border-radius:50%; border:2px solid var(--couleur); display:grid; place-items:center; }
.coche .case .ico{ width:14px; height:14px; opacity:0; stroke-width:3; }
.coche[aria-pressed="true"]{ background:var(--couleur); color:var(--surface); }
.coche[aria-pressed="true"] .case{ background:var(--surface); border-color:var(--surface); }
.coche[aria-pressed="true"] .case .ico{ opacity:1; stroke:var(--couleur); }
.lien{ background:none; border:0; color:var(--titre-c); text-decoration:underline; text-decoration-color:var(--or); text-underline-offset:3px; font-weight:700; padding:6px 4px; font-size:14px; }

/* ---------- Ajustement d'un repas ---------- */
.repas.edition{ outline:2px solid var(--or); }
.lignes-ed{ list-style:none; padding:0; margin:10px 0 6px; display:grid; gap:6px; }
.lignes-ed li{ display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center; }
.lignes-ed .nom-ed{ font-size:15px; }
.lignes-ed .ecart{ display:block; font-size:12px; color:var(--brume); }
.qte{ display:flex; align-items:center; gap:4px; }
.qte button,.suppr{ width:34px; height:34px; border-radius:50%; border:1px solid var(--trait); background:var(--surface); font-weight:700; font-size:18px; padding:0; line-height:1; }
.qte input{ width:64px; text-align:right; border:1px solid var(--trait); border-radius:10px; padding:6px 6px; background:var(--surface); font-size:15px; font-variant-numeric:tabular-nums; }
.qte .u{ font-size:13px; color:var(--brume); width:34px; }
.suppr{ color:var(--alerte); }
.ajout-ed{ display:grid; grid-template-columns:1fr auto; gap:8px; margin:8px 0 10px; }
.ajout-ed select{ border:1px solid var(--trait); background:var(--surface); border-radius:12px; padding:9px 10px; font-size:15px; color:var(--encre); }
.btns-ed{ display:flex; gap:8px; flex-wrap:wrap; }
.btns-ed .bouton{ padding:10px 16px; font-size:15px; }

/* ---------- Stock ---------- */
.stock-ligne{ display:grid; grid-template-columns:minmax(0,1fr) auto auto 34px; gap:8px; align-items:baseline; padding:9px 4px; border-bottom:1px solid var(--trait); font-variant-numeric:tabular-nums; }
.stock-ligne .n{ text-align:right; min-width:68px; }
.stock-tete{ font-size:12px; font-weight:700; color:var(--brume); border-bottom:1px solid var(--trait); }
.manque{ color:var(--alerte); font-weight:700; }
.jeter{ width:34px; height:34px; border-radius:50%; border:1px solid var(--trait); background:var(--surface); padding:0; display:grid; place-items:center; color:var(--brume); align-self:center; }
.jeter .ico{ width:17px; height:17px; }
.jeter-form{ grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--surface-2); border-radius:12px; padding:10px 12px; font-size:14px; }
.jeter-form input{ width:90px; border:1px solid var(--trait); border-radius:10px; padding:6px 8px; background:var(--surface); font-size:15px; text-align:right; }
.jeter-form .bouton{ padding:8px 14px; font-size:14px; }
.pertes{ margin-top:18px; }
.pertes li{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; padding:6px 0; border-bottom:1px solid var(--trait); font-size:14px; }
.pertes ul{ list-style:none; padding:0; margin:6px 0 0; }
.depasse{ margin-top:12px; border:2px solid color-mix(in srgb, var(--alerte) 40%, transparent); }
.depasse ul{ list-style:none; padding:0; margin:4px 0 12px; }
.depasse li{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--trait); font-size:14px; }
.depasse li > span{ min-width:0; }
.depasse li .discret{ display:block; font-size:12px; }
.depasse li .bouton{ padding:8px 12px; font-size:14px; flex:none; }
.depasse .modifs{ margin-top:12px; }
.courses-puces{ margin:0 0 4px; }
.generation{ margin-top:16px; }
.generation .bouton .ico{ width:20px; height:20px; }
.gen-liste{ list-style:none; padding:0; margin:12px 0; max-height:420px; overflow:auto; border-top:1px solid var(--trait); }
.gen-liste li{ display:grid; grid-template-columns:110px minmax(0,1fr); gap:10px; padding:8px 0; border-bottom:1px solid var(--trait); font-size:14px; }
.gen-jour{ font-weight:700; color:var(--titre-c); display:flex; gap:4px; align-items:flex-start; flex-wrap:wrap; }
.gen-jour .ico{ width:14px; height:14px; color:var(--or); }
.gen-repas-col{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.gen-repas{ display:block; width:100%; text-align:left; border:0; background:none; padding:5px 8px; margin:0 -8px; border-radius:10px; font-size:14px; line-height:1.35; color:var(--encre); }
.gen-repas:hover, .gen-repas:focus-visible{ background:var(--surface-2); }
.gen-repas.fort{ font-weight:700; }
.gen-repas.discret{ color:var(--brume); }
.gen-k{ display:block; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--brume); }
.choix-liste{ list-style:none; padding:0; margin:12px 0 0; }
.choix-liste li + li{ border-top:1px solid var(--trait); }
.choix-plat{ display:flex; flex-direction:column; gap:2px; width:100%; text-align:left; border:0; background:none; padding:10px 6px; border-radius:10px; font-size:15px; color:var(--encre); }
.choix-plat:hover, .choix-plat:focus-visible{ background:var(--surface-2); }
.choix-plat .discret{ font-size:13px; }
.choix-plat.actuel{ background:color-mix(in srgb, var(--or) 18%, var(--surface)); }
.feuille-ia .puces{ margin:10px 0 0; }
.gen-grille{ display:block; }
.gen-col{ min-width:0; }
.biblio, .sur-ordi{ display:none; }
.gen-repas.cible{ background:color-mix(in srgb, var(--or) 30%, var(--surface)); outline:2px dashed var(--or); }
.plein-ecran{ margin-top:8px; }
@media (min-width:960px) and (hover:hover){
  .gen-grille{ display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:18px; align-items:start; }
  .sur-ordi{ display:inline; }
  .biblio{ display:block; position:sticky; top:16px; max-height:calc(100vh - 32px); overflow:auto; background:var(--surface-2); border-radius:18px; padding:14px; margin-top:12px; }
  .biblio input{ width:100%; border:1px solid var(--trait); border-radius:12px; padding:8px 10px; background:var(--surface); font-size:14px; }
  .biblio .puces{ margin:8px 0; gap:6px; }
  .biblio .puce{ font-size:13px; padding:4px 10px; }
  .biblio-liste{ list-style:none; padding:0; margin:0; }
  .biblio-plat{ display:flex; flex-direction:column; gap:1px; padding:8px 10px; margin:4px 0; border-radius:10px; background:var(--surface); border:1px solid var(--trait); cursor:grab; font-size:14px; }
  .biblio-plat:active{ cursor:grabbing; }
  .biblio-plat.glisse{ opacity:.5; }
  .biblio-plat .discret{ font-size:12px; }
}
.courses-puces .puce span{ font-weight:500; margin-left:4px; }
.article label.qte-achat{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:4px; font-size:13px; color:var(--brume); font-weight:500; }
.article label.qte-achat input, .article label.qte-achat input:not(:placeholder-shown){ width:70px; border:1px solid var(--trait); border-radius:10px; padding:5px 8px; background:var(--surface); font-size:15px; font-weight:500; text-align:right; font-variant-numeric:tabular-nums; }

/* ---------- Boutons ---------- */
.bouton{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:14px; padding:13px 20px; font-weight:700; font-size:16px; background:var(--primaire); color:var(--sur-primaire); }
.bouton.or{ background:var(--or); color:#2C1810; }
.bouton.plein{ width:100%; }
.bouton.leger{ background:var(--surface-2); color:var(--titre-c); }
.bouton:disabled{ opacity:.5; cursor:default; }
.faim{ margin-top:18px; width:100%; justify-content:space-between; padding:18px 20px; border-radius:20px; font-size:18px; font-family:var(--titre); text-align:left; }
.faim small{ display:block; font-family:var(--texte); font-weight:500; font-size:13px; opacity:.85; }
.faim .ico{ width:30px; height:30px; }

/* ---------- Planning ---------- */
.cal{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; margin-top:16px; }
.cal .jsem{ text-align:center; font-size:12px; font-weight:700; color:var(--brume); }
.case-j{ min-width:0; overflow:hidden; color:var(--encre); background:var(--surface); border:1px solid var(--trait); border-radius:14px; min-height:78px; padding:7px 4px; display:flex; flex-direction:column; align-items:center; gap:5px; }
.case-j.vide{ background:transparent; border-color:transparent; }
.case-j .num{ font-family:var(--titre); font-weight:700; font-size:18px; line-height:1; }
.case-j .barres{ display:flex; gap:2px; }
.case-j .barres i{ width:8px; height:5px; border-radius:3px; border:1.5px solid var(--c); }
.case-j .barres i.ok{ background:var(--c); }
.case-j .marques{ display:flex; gap:3px; height:14px; color:var(--or); }
.case-j .marques .ico{ width:14px; height:14px; }
.case-j .cout{ font-size:11px; white-space:nowrap; letter-spacing:-.02em; color:var(--brume); font-variant-numeric:tabular-nums; }
.case-j[aria-current="date"]{ border:2px solid var(--or); }
.case-j.passe{ background:var(--surface-2); }
.legende{ display:flex; flex-wrap:wrap; gap:14px; margin-top:14px; font-size:13px; color:var(--brume); }
.legende span{ display:inline-flex; align-items:center; gap:6px; }
.legende .ico{ width:15px; height:15px; color:var(--or); }
.progress-plan{ margin-top:16px; background:var(--surface); border-radius:18px; padding:16px; }

/* ---------- Courses ---------- */
.segments{ display:grid; grid-template-columns:repeat(var(--n,3),1fr); background:var(--surface-2); border-radius:16px; padding:4px; margin:16px 0; }
.segments button{ border:0; background:none; border-radius:12px; padding:10px 8px; font-weight:700; text-align:left; line-height:1.25; min-width:0; overflow-wrap:anywhere; }
.segments button span{ display:block; font-weight:500; font-size:13px; color:var(--brume); }
.segments button[aria-pressed="true"]{ background:var(--surface); box-shadow:var(--ombre); }
@media (max-width:420px){ .segments button{ padding:9px 6px; font-size:14px; } .segments button span{ font-size:12px; } }
.prix-ligne{ display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:center; padding:10px 4px; border-bottom:1px solid var(--trait); }
.prix-ligne .nom{ font-weight:700; }
.prix-ligne .detail{ font-size:13px; color:var(--brume); }
.prix-ligne .saisie-prix{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--brume); white-space:nowrap; }
.prix-ligne input{ width:84px; border:1px solid var(--trait); border-radius:10px; padding:6px 8px; background:var(--surface); font-size:15px; text-align:right; }
.prix-ligne input.modifie{ border-color:var(--or); border-width:2px; }
.prix-ligne .lien{ padding:0 2px; font-size:13px; }
.etiq-estime{ display:inline-block; font-size:11px; font-weight:700; padding:1px 7px; border-radius:999px; background:color-mix(in srgb, var(--or) 25%, var(--surface)); color:var(--titre-c); margin-left:6px; vertical-align:1px; }
.totaux{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
.totaux div{ background:var(--surface); border-radius:16px; padding:12px; }
.totaux .chiffre{ font-size:20px; display:block; }

<script>
/* Moteur de composition (app/moteur.js), injecté par construire.py */
/* ============================================================
   Marmite — moteur de composition d'une période (sans IA)
   Par défaut un mois calendaire ; on peut choisir la date de début, le nombre de jours,
   le nombre d'invités et le budget.
   Entrées : catalogue, recettes, réglages, profils, stock de départ.
   Sortie : un mois au format de donnees/mois/<aaaa-mm>.json (plan, courses, share)
            + un bilan (nutrition, coûts, quotas, alertes).
   Fonctionne dans le navigateur (objet global Moteur) et sous Node (module.exports).
   ============================================================ */
const Moteur = (() => {
  const PERSONNES = ["nicolas", "aurelie"];
  const LABELS = { pdj: "Petit-déjeuner", dej: "Déjeuner", din: "Dîner", des: "Dessert" };
  const JOURS_SEM = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
  const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
  const UNITES_ENTIERES = new Set(["Œufs", "Wraps", "Pains burger"]);
  const JOUR_MS = 86400000;

  /* ---------- Outils ---------- */
  // Générateur pseudo-aléatoire à graine : même graine, même planning.
  function hasard(graine) {
    let a = graine >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const arrondi = (x, pas) => Math.round(x / pas) * pas;
  const r2 = x => Math.round(x * 100) / 100;
  const dateISO = s => { const [a, m, j] = s.split("-").map(Number); return new Date(Date.UTC(a, m - 1, j)); };
  const iso = d => d.toISOString().slice(0, 10);
  const plus = (d, n) => new Date(d.getTime() + n * JOUR_MS);
  const joursDansMois = d => new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
  const jourMois = d => { const j = d.getUTCDate(); return j === 1 ? "1er" : String(j); };
  const nomJour = d => `${JOURS_SEM[d.getUTCDay()]} ${jourMois(d)} ${MOIS[d.getUTCMonth()]}`;
  const court = d => `${jourMois(d)} ${MOIS[d.getUTCMonth()]}`;

  /* ---------- Nutrition et prix ---------- */
  function nutrition(cat, a, q) {
    const n = cat[a] && cat[a].nut; if (!n) return { kcal: 0, prot: 0 };
    return { kcal: n[2] * q / n[0], prot: n[3] * q / n[0] };
  }
  function totaux(cat, items) {
    let kcal = 0, prot = 0;
    for (const [a, q] of items) { const n = nutrition(cat, a, q); kcal += n.kcal; prot += n.prot; }
    return { kcal, prot };
  }
  // Prix d'une unité consommée (g, ml, unité) : conditionnement, ou kilo brut en vrac corrigé du rendement.
  function prixUnitaire(cat, a) {
    const c = cat[a]; if (!c || c.prix == null) return 0;
    return c.vrac ? c.prix / 1000 / (c.rend || 1) : c.prix / c.cond;
  }
  const coutItems = (cat, items) => items.reduce((s, [a, q]) => s + prixUnitaire(cat, a) * q, 0);
  // Un plat principal doit contenir une protéine animale (viande, poisson, charcuterie ; les œufs ne comptent pas).
  const aProteineAnimale = (cat, r) => r.portions.nicolas.some(([a]) => cat[a] && cat[a].animal);

  /* ---------- Objectifs ---------- */
  // Les besoins baissent avec le poids : environ 14 kcal par kg (métabolisme de base × activité légère).
  // Les protéines restent calées sur le profil, qui vise le poids objectif.
  function objectifs(profil, poidsActuel) {
    const delta = poidsActuel != null && profil.poids ? poidsActuel - profil.poids : 0;
    const k = Math.round(delta * 14);
    return { kcalMin: profil.kcalMin + k, kcalMax: profil.kcalMax + k, prot: profil.prot };
  }

  /* ---------- Calendrier et courses ---------- */
  // debut : Date (UTC) ; n : nombre de jours ; joursCourses : dates ISO imposées, sinon les jours du mois des réglages.
  function calendrier(debut, n, reglages, joursCourses) {
    const dates = []; for (let j = 1; j <= n; j++) dates.push(plus(debut, j - 1));
    const estCourse = d => joursCourses ? joursCourses.includes(iso(d)) : reglages.courses.jours.includes(d.getUTCDate());
    const jc = []; for (let j = 1; j <= n; j++) if (estCourse(dates[j - 1])) jc.push(j);
    // âge des produits frais au jour j : jours écoulés depuis la dernière course
    // (avant la première course de la période : on remonte le calendrier des réglages)
    const age = j => {
      const c = jc.filter(x => x <= j).slice(-1)[0];
      if (c != null) return j - c;
      for (let k = 1; k <= 62; k++) if (reglages.courses.jours.includes(plus(dates[j - 1], -k).getUTCDate())) return k;
      return 7;
    };
    const periodes = jc.map((c, i) => ({ id: i + 1, debut: c, fin: (jc[i + 1] || n + 1) - 1 }));
    return { n, dates, jc, age, periodes };
  }

  /* ---------- Composition du planning ---------- */
  function composer(ctx) {
    const { cat, recettes, reglages, cal, alea, poidsCout, exclure, quotas } = ctx;
    const actives = recettes.filter(r => !exclure.has(r.id));
    const principaux = actives.filter(r => (r.repas.includes("dej") || r.repas.includes("din")) && aProteineAnimale(cat, r));
    const plats = principaux.filter(r => !r.tags.includes("restes"));
    const restes = principaux.filter(r => r.tags.includes("restes") && r.suit);
    const desserts = actives.filter(r => r.repas.includes("des"));
    const pdj = actives.find(r => r.repas.includes("pdj"));
    const ecart = reglages.ecartMinJours || 5;
    const N = cal.n;
    const avantCourse = cal.jc.length ? cal.jc[0] - 1 : 0;
    const grille = {}; // "j-k" -> recette
    const place = (j, k, r) => { grille[`${j}-${k}`] = r; };
    const libre = (j, k) => j >= 1 && j <= N && !grille[`${j}-${k}`];
    // les variantes d'un même plat (« Bœuf sauté asiatique, riz, légumes » / « …, poivrons-carottes ») comptent ensemble
    const usages = r => Object.values(grille).filter(x => famille(x) === famille(r)).length;
    // historique : plats des jours précédant la période (j ≤ 0), pour respecter l'écart à la jointure
    const historique = (ctx.historique || []).map(h => ({ j: h.j, r: recettes.find(x => x.id === h.recette) })).filter(h => h.r);
    const tropProche = (r, j) => Object.entries(grille).some(([cle, x]) => famille(x) === famille(r) && Math.abs(+cle.split("-")[0] - j) < ecart)
      || historique.some(h => famille(h.r) === famille(r) && j - h.j < ecart);
    const coutRef = r => PERSONNES.reduce((s, p) => s + coutItems(cat, r.portions[p]), 0);
    const coutMoyen = plats.reduce((s, r) => s + coutRef(r), 0) / Math.max(1, plats.length);
    const principal = (r, role) => {
      const it = r.portions.nicolas.filter(([a]) => cat[a] && cat[a].role === role).sort((x, y) => y[1] - x[1]);
      return it.length ? it[0][0] : null;
    };
    // stock de départ encore disponible : utilisé en priorité, et seul disponible avant la première course
    const stockConnu = Object.keys(ctx.stockDepart).length > 0;
    const stockDispo = Object.assign({}, ctx.stockDepart);
    const besoinRef = (r, a) => PERSONNES.reduce((s, p) => s + r.portions[p].filter(([x]) => x === a).reduce((t, [, q]) => t + q, 0), 0);
    const consommer = r => { for (const p of PERSONNES) for (const [a, q] of r.portions[p]) if (stockDispo[a] != null) stockDispo[a] -= q; };

    function score(r, j, k) {
      if (tropProche(r, j)) return -Infinity;
      let s = alea() * 1.2;
      // produits frais : pénalité si le plat tombe au-delà de leur conservation depuis la dernière course
      s -= penaliteFrais(cat, r, cal.age(j));
      // même protéine ou même féculent deux fois dans la journée
      const autre = grille[`${j}-${k === "dej" ? "din" : "dej"}`];
      if (autre) {
        if (principal(autre, "proteine") === principal(r, "proteine")) s -= 1.5;
        if (principal(autre, "feculent") === principal(r, "feculent")) s -= 0.5;
      }
      s -= 1.5 * usages(r);
      s -= poidsCout * (coutRef(r) / coutMoyen - 1);
      // stock de départ : bonus si le plat l'utilise et qu'il en reste assez ; en mode « selon le stock »,
      // chaque ingrédient qu'il faudrait acheter pénalise aussi le plat
      for (const [a, q] of r.portions.nicolas) if (stockDispo[a] != null && stockDispo[a] >= q * 2) s += ctx.poidsStock != null ? ctx.poidsStock : 1.5;
      if (ctx.penaliteManque && stockConnu)
        for (const [a] of r.portions.nicolas) if (!(stockDispo[a] >= besoinRef(r, a))) s -= ctx.penaliteManque;
      // avant la première course, on vit sur le stock : chaque ingrédient manquant coûte cher
      if (j <= avantCourse && stockConnu)
        for (const [a] of r.portions.nicolas) if (!(stockDispo[a] >= besoinRef(r, a))) s -= 2;
      return s;
    }
    function meilleur(liste, j, k) {
      let top = null, best = -Infinity;
      for (const r of liste) { const v = score(r, j, k); if (v > best) { best = v; top = r; } }
      return top;
    }
    function placerAvecRestes(j, k, r) {
      place(j, k, r); consommer(r);
      const suite = restes.find(x => x.suit === r.id);
      if (!suite) return;
      // au dîner qui suit : le jour même si le plat est un déjeuner, sinon dans le délai permis
      for (let d = k === "dej" ? 0 : 1; d <= Math.max(1, suite.delaiMaxJours || 0); d++) {
        if (libre(j + d, "din") && !tropProche(suite, j + d)) { place(j + d, "din", suite); consommer(suite); return; }
      }
    }

    // 1. repas plaisir : déjeuners du week-end, répartis sur la période (hors jours avant la première course si possible)
    const weekends = [];
    for (let j = 1; j <= N; j++) { const w = cal.dates[j - 1].getUTCDay(); if (w === 0 || w === 6) weekends.push(j); }
    const apres = weekends.filter(j => j > avantCourse);
    const joursPlaisir = repartir(apres.length >= quotas.plaisir ? apres : weekends, quotas.plaisir, N);
    const plaisirs = plats.filter(r => r.tags.includes("plaisir"));
    for (const j of joursPlaisir) { const r = meilleur(plaisirs, j, "dej") || meilleur(plats, j, "dej"); if (r) placerAvecRestes(j, "dej", r); }

    // 2. poisson : réparti régulièrement, en alternant déjeuner et dîner
    const poissons = plats.filter(r => r.tags.includes("poisson"));
    for (let i = 0; i < quotas.poisson; i++) {
      let j = Math.min(N, Math.max(1, Math.round((i + 0.5) * N / quotas.poisson)));
      let k = i % 2 ? "dej" : "din";
      for (let d = 0; d < N && !libre(j, k); d++) { const alt = k === "dej" ? "din" : "dej"; if (libre(j, alt)) { k = alt; break; } j = j % N + 1; }
      const r = meilleur(poissons, j, k); if (r) placerAvecRestes(j, k, r);
    }

    // 3. le reste, jour par jour
    const courants = plats.filter(r => !r.tags.includes("poisson") && !r.tags.includes("plaisir"));
    for (let j = 1; j <= N; j++) for (const k of ["dej", "din"]) {
      if (!libre(j, k)) continue;
      const r = meilleur(courants, j, k) || meilleur(plats, j, k);
      if (r) placerAvecRestes(j, k, r);
    }

    // 4. desserts : glace les jours plaisir, sinon la répartition du mois de référence, fruits frais près des courses
    const poidsDes = {};
    for (const r of desserts) poidsDes[r.id] = r.frequenceReference || 1;
    const hors = desserts.filter(r => !/glace/i.test(r.nom || ""));
    const glace = desserts.find(r => /glace/i.test(r.nom || ""));
    const totalPoids = hors.reduce((s, r) => s + poidsDes[r.id], 0);
    const faits = {};
    for (let j = 1; j <= N; j++) {
      if (glace && joursPlaisir.includes(j)) { place(j, "des", glace); continue; }
      let top = null, best = -Infinity;
      const places = Object.values(faits).reduce((s, v) => s + v, 0) + 1;
      for (const r of hors) {
        let s = poidsDes[r.id] / totalPoids * places - (faits[r.id] || 0);
        s -= penaliteFrais(cat, r, cal.age(j));
        const hier = grille[`${j - 1}-des`]; if (hier && hier.id === r.id) s -= 0.7;
        s += alea() * 0.3;
        if (s > best) { best = s; top = r; }
      }
      if (top) { place(j, "des", top); faits[top.id] = (faits[top.id] || 0) + 1; }
    }
    if (pdj) for (let j = 1; j <= N; j++) place(j, "pdj", pdj);
    return { grille, joursPlaisir };
  }

  // Grille « jour-repas » → recette, à partir d'identifiants ; les jours plaisir sont ceux d'un plat plaisir.
  function grilleDepuis(ids, recettes) {
    const grille = {}, joursPlaisir = [];
    for (const [cle, id] of Object.entries(ids)) {
      const r = recettes.find(x => x.id === id); if (!r) continue;
      grille[cle] = r;
      const [j, k] = cle.split("-");
      if ((k === "dej" || k === "din") && (r.tags || []).includes("plaisir") && !joursPlaisir.includes(+j)) joursPlaisir.push(+j);
    }
    return { grille, joursPlaisir: joursPlaisir.sort((a, b) => a - b) };
  }
  // Grille d'un mois déjà composé (pour la modifier puis la recalculer).
  const grilleDuMois = mois => Object.fromEntries(mois.plan.flatMap(j => j.meals.map(m => [`${j.d}-${m.k}`, m.recette])));

  // Choisit n jours dans la liste en maximisant l'écart entre eux.
  function repartir(candidats, n, N) {
    if (candidats.length <= n) return candidats.slice();
    const ecartMin = Math.max(2, Math.floor(N / n) - 2);
    const choix = [];
    for (let i = 0; i < n; i++) {
      const cible = (i + 0.5) * N / n;
      const libres = candidats.filter(c => !choix.includes(c));
      const loin = libres.filter(c => choix.every(x => Math.abs(x - c) >= ecartMin));
      const pool = loin.length ? loin : libres;
      choix.push(pool.reduce((b, c) => Math.abs(c - cible) < Math.abs(b - cible) ? c : b));
    }
    return choix.sort((x, y) => x - y);
  }

  // Famille d'un plat : son nom avant la première virgule ou parenthèse.
  const famille = r => (r.nom || r.id).split(/[,(+]/)[0].trim().toLowerCase();

  // Produits frais utilisés au-delà de leur conservation depuis la dernière course :
  // pénalité qui grandit avec le dépassement, plafonnée par produit.
  function penaliteFrais(cat, r, age) {
    let s = 0;
    for (const [a] of r.portions.nicolas) {
      const c = cat[a]; if (!c || !c.conservation) continue;
      const depasse = age - c.conservation.jours + 1;
      if (depasse > 0) s += Math.min(1.5, 0.5 * depasse);
    }
    return s;
  }

  /* ---------- Portions ---------- */
  // Par personne et par jour : protéines des plats principaux calées sur l'objectif de protéines,
  // puis féculents calés sur le milieu de la fourchette de kcal. Légumes et desserts inchangés.
  function portionsDuJour(cat, repas, obj) {
    const items = {};
    for (const k of Object.keys(repas)) items[k] = repas[k].map(([a, q]) => [a, q]);
    const principaux = ["dej", "din"].filter(k => items[k]);
    const jour = () => totaux(cat, Object.values(items).flat());
    const deRole = role => principaux.flatMap(k => items[k].filter(([a]) => cat[a] && cat[a].role === role));
    const echelle = (role, f) => { for (const k of principaux) items[k] = items[k].map(([a, q]) => [a, cat[a] && cat[a].role === role ? q * f : q]); };

    const protRole = totaux(cat, deRole("proteine")).prot;
    let t = jour();
    if (protRole > 0) {
      const cible = obj.prot * 1.02;
      const f = Math.min(1.4, Math.max(0.85, 1 + (cible - t.prot) / protRole));
      if (t.prot < obj.prot || t.prot > obj.prot * 1.15) echelle("proteine", f);
    }
    t = jour();
    const kFec = totaux(cat, deRole("feculent")).kcal;
    if (kFec > 0) {
      const cible = (obj.kcalMin + obj.kcalMax) / 2;
      echelle("feculent", Math.min(1.6, Math.max(0.5, 1 + (cible - t.kcal) / kFec)));
    }
    return arrondir(items);
  }
  // arrondis : unités entières, 5 g ou 5 ml sinon
  function arrondir(items) {
    const out = {};
    for (const k of Object.keys(items)) out[k] = items[k].map(([a, q]) => [a, UNITES_ENTIERES.has(a) ? Math.max(1, Math.round(q)) : Math.max(5, arrondi(q, 5))]);
    return out;
  }
  // Portion d'un invité : la moyenne de Nicolas et d'Aurélie, ingrédient par ingrédient.
  function portionInvite(itN, itA) {
    const q = {};
    for (const [a, x] of itN) q[a] = (q[a] || 0) + x / 2;
    for (const [a, x] of itA) q[a] = (q[a] || 0) + x / 2;
    return Object.entries(q);
  }

  /* ---------- Courses ---------- */
  function listeCourses(ctx, plan) {
    const { cat, reglages, cal, invites } = ctx;
    const N = cal.n;
    const QUI = invites > 0 ? PERSONNES.concat("invites") : PERSONNES;
    // consommation par jour, par convive et par produit (repas + hors repas)
    const conso = [];
    for (let j = 1; j <= N; j++) {
      const c = { nicolas: {}, aurelie: {}, invites: {} };
      for (const m of plan[j - 1].meals) for (const p of QUI) for (const [a, q] of m.items[p] || []) c[p][a] = (c[p][a] || 0) + q * (p === "invites" ? invites : 1);
      for (const h of reglages.horsRepas || []) for (const p of PERSONNES) if (h.parJour[p]) c[p][h.a] = (c[p][h.a] || 0) + h.parJour[p];
      conso.push(c);
    }
    const besoin = (a, d1, d2, p) => { let s = 0; for (let j = d1; j <= d2; j++) { const c = conso[j - 1]; for (const pp of p ? [p] : QUI) s += c[pp][a] || 0; } return s; };
    const produits = [...new Set(conso.flatMap(c => QUI.flatMap(p => Object.keys(c[p]))))];
    const stock = {};
    for (const a of produits) stock[a] = ctx.stockDepart[a] || 0;
    const manquesAvant = [], ruptures = [], fraisAVerifier = [];

    // avant la première course : on vit sur le stock
    const avant = cal.jc.length ? cal.jc[0] - 1 : N;
    for (const a of produits) {
      const b = besoin(a, 1, avant);
      if (b > stock[a] + 1e-6) manquesAvant.push({ a, q: r2(b - stock[a]) });
      stock[a] = Math.max(0, stock[a] - b);
    }

    const courses = [];
    for (const per of cal.periodes) {
      const items = [];
      // frais restant de la période précédente et plus vieux que sa conservation estimée :
      // signalé pour l'inventaire, jamais compté en perte d'office (c'est l'utilisateur qui le jette ou non)
      if (per.id > 1) {
        const ecoule = per.debut - cal.periodes[per.id - 2].debut;
        for (const a of produits) {
          const c = cat[a];
          if (c && c.conservation && c.conservation.frais && stock[a] > 0.5 && ecoule >= c.conservation.jours)
            fraisAVerifier.push({ a, course: per.id, q: r2(stock[a]) });
        }
      }
      for (const a of produits) {
        const c = cat[a]; if (!c) continue;
        // chaque course couvre sa période ; les restes passent à la suivante
        const b = besoin(a, per.debut, per.fin);
        const manque = b - stock[a];
        let buy = 0, est = 0;
        if (manque > 1e-6) {
          if (c.vrac) { const pas = c.pasAchat || 50; buy = Math.ceil(manque / (c.rend || 1) / pas - 1e-9) * pas; est = buy / 1000 * (c.prix || 0); stock[a] += buy * (c.rend || 1); }
          else { buy = Math.ceil(manque / c.cond - 1e-9); est = buy * (c.prix || 0); stock[a] += buy * c.cond; }
        }
        const nd = {}; for (const p of QUI) nd[p] = besoin(a, per.debut, per.fin, p);
        stock[a] -= b;
        if (stock[a] < -1e-6) { ruptures.push({ a, course: per.id, q: r2(-stock[a]) }); stock[a] = 0; }
        if (buy > 0) {
          const it = { a, buy, est: r2(est), needN: r2(nd.nicolas), needA: r2(nd.aurelie) };
          if (invites > 0) it.needI = r2(nd.invites);
          items.push(it);
        }
      }
      const d1 = cal.dates[per.debut - 1], d2 = cal.dates[per.fin - 1];
      courses.push({
        id: per.id, date: iso(d1), jourPlan: per.debut, titre: `Course ${per.id}`,
        jour: nomJour(d1), couvre: `du ${court(d1)} au ${court(d2)}`,
        items: items.sort((x, y) => produits.indexOf(x.a) - produits.indexOf(y.a)),
      });
    }
    const stockFin = {};
    for (const a of produits) if (stock[a] > 0.5) stockFin[a] = r2(stock[a]);
    return { courses, conso, manquesAvant, ruptures, stockFin, fraisAVerifier, QUI };
  }

  /* ---------- Point d'entrée ---------- */
  // entrees : { catalogue, recettes, reglages, debut ("aaaa-mm-jj") ou annee + mois, jours?, invites?, budget?,
  //             quotas?, joursCourses?, graine?, stockDepart?, profils?, poidsActuels?, exclure?, moisReference? }
  function composerMois(entrees) {
    const { catalogue, recettes, reglages } = entrees;
    const cat = catalogue;
    const debut = entrees.debut ? dateISO(entrees.debut) : new Date(Date.UTC(entrees.annee, entrees.mois - 1, 1));
    const moisEntier = debut.getUTCDate() === 1 && (entrees.jours == null || entrees.jours === joursDansMois(debut));
    const n = entrees.jours || joursDansMois(debut);
    const invites = Math.max(0, Math.round(entrees.invites || 0));
    const profils = {};
    for (const p of PERSONNES) {
      const base = Object.assign({}, reglages.personnes[p], (entrees.profils || {})[p] || {});
      profils[p] = Object.assign(base, objectifs(base, (entrees.poidsActuels || {})[p]));
    }
    const cal = calendrier(debut, n, reglages, entrees.joursCourses);
    const exclure = new Set(entrees.exclure || []);
    // quotas : ceux des réglages pour un mois entier, au prorata sinon
    const quotas = entrees.quotas || (moisEntier ? reglages.quotas
      : { poisson: Math.round(reglages.quotas.poisson * n / joursDansMois(debut)), plaisir: Math.round(reglages.quotas.plaisir * n / joursDansMois(debut)) });
    // budget des achats de la période : saisi, sinon celui des profils ramené à la durée (invités non compris)
    const budget = entrees.budget != null ? entrees.budget
      : PERSONNES.reduce((s, p) => s + profils[p].budget * n / (profils[p].budgetJours || n), 0);

    // fréquence des desserts dans le mois de référence : sert de répartition cible
    const freq = {};
    for (const j of entrees.moisReference ? entrees.moisReference.plan : []) for (const m of j.meals) if (m.k === "des") freq[m.recette] = (freq[m.recette] || 0) + 1;
    const recs = recettes.map(r => Object.assign({}, r, { frequenceReference: freq[r.id] || 1 }));

    // on recompose en donnant plus de poids au coût tant que les achats dépassent le budget (6 passes au plus)
    let res = null;
    // grille imposée (un repas changé à la main) : on garde tous les plats, on recalcule portions, courses et bilan
    const passes = entrees.grilleImposee ? 1 : entrees.passes || 6, pasCout = entrees.pasCout || 0.8;
    for (let passe = 0; passe < passes; passe++) {
      const historique = (entrees.historique || []).map(h => ({ j: Math.round((dateISO(h.date) - debut) / JOUR_MS) + 1, recette: h.recette }));
      const ctx = { cat, recettes: recs, reglages, cal, exclure, quotas, invites, historique, stockDepart: entrees.stockDepart || {},
        poidsStock: entrees.poidsStock, penaliteManque: entrees.penaliteManque || 0,
        alea: hasard((entrees.graine || 1) + passe * 7919), poidsCout: 0.5 + passe * pasCout };
      const { grille, joursPlaisir } = entrees.grilleImposee ? grilleDepuis(entrees.grilleImposee, recs) : composer(ctx);
      const plan = [];
      for (let j = 1; j <= n; j++) {
        const parPersonne = {};
        for (const p of PERSONNES) {
          const repas = {};
          for (const k of ["pdj", "dej", "din", "des"]) { const r = grille[`${j}-${k}`]; if (r) repas[k] = r.portions[p]; }
          parPersonne[p] = portionsDuJour(cat, repas, profils[p]);
        }
        const meals = ["pdj", "dej", "din", "des"].filter(k => grille[`${j}-${k}`]).map(k => {
          const r = grille[`${j}-${k}`];
          const items = { nicolas: parPersonne.nicolas[k], aurelie: parPersonne.aurelie[k] };
          if (invites > 0) items.invites = arrondir({ x: portionInvite(items.nicolas, items.aurelie) }).x;
          return { k, label: LABELS[k], plat: r.nomParPersonne || { nicolas: r.nom, aurelie: r.nom }, items, recette: r.id };
        });
        const fish = meals.some(m => (grille[`${j}-${m.k}`].tags || []).includes("poisson"));
        plan.push({ d: j, date: iso(cal.dates[j - 1]), tag: joursPlaisir.includes(j) ? "plaisir" : (fish ? "poisson" : ""), fish, meals });
      }
      const cr = listeCourses(ctx, plan);
      const achats = cr.courses.reduce((s, c) => s + c.items.reduce((t, i) => t + i.est, 0), 0);
      // on garde la passe la moins chère (la dernière n'est pas forcément la meilleure)
      if (!res || achats < res.achats) res = { ctx, plan, cr, joursPlaisir, achats };
      if (achats <= budget) break;
    }

    const { plan, cr, joursPlaisir, achats } = res;
    const cout = {};
    for (const p of cr.QUI) cout[p] = 0;
    for (const c of cr.conso) for (const p of cr.QUI) for (const [a, q] of Object.entries(c[p])) cout[p] += prixUnitaire(cat, a) * q;
    // part de Nicolas dans la consommation du foyer (invités exclus) de chaque produit
    const share = {}, tot = {};
    for (const c of cr.conso) for (const p of PERSONNES) for (const [a, q] of Object.entries(c[p])) { tot[a] = tot[a] || { nicolas: 0, aurelie: 0 }; tot[a][p] += q; }
    for (const [a, t] of Object.entries(tot)) share[a] = t.nicolas + t.aurelie ? Math.round(t.nicolas / (t.nicolas + t.aurelie) * 10000) / 10000 : 0.5;

    // bilan nutritionnel et alertes
    const nut = {}, horsFourchette = [];
    for (const p of PERSONNES) {
      let k = 0, pr = 0;
      for (const j of plan) {
        const t = totaux(cat, j.meals.flatMap(m => m.items[p])); k += t.kcal; pr += t.prot;
        if (t.kcal < profils[p].kcalMin - 50 || t.kcal > profils[p].kcalMax + 50 || t.prot < profils[p].prot - 5)
          horsFourchette.push({ p, d: j.d, kcal: Math.round(t.kcal), prot: Math.round(t.prot) });
      }
      nut[p] = { kcalMoyen: Math.round(k / plan.length), protMoyen: Math.round(pr / plan.length), objectifs: { kcalMin: profils[p].kcalMin, kcalMax: profils[p].kcalMax, prot: profils[p].prot } };
    }
    const fraisTard = [];
    for (const j of plan) for (const m of j.meals) for (const a of new Set(m.items.nicolas.concat(m.items.aurelie).map(([x]) => x))) {
      const c = cat[a]; if (c && c.conservation && res.ctx.cal.age(j.d) >= c.conservation.jours) fraisTard.push({ d: j.d, k: m.k, a });
    }
    const tagsDe = id => (recettes.find(r => r.id === id).tags || []);
    const compte = tag => plan.reduce((s, j) => s + j.meals.filter(m => (m.k === "dej" || m.k === "din") && tagsDe(m.recette).includes(tag)).length, 0);
    const fin = cal.dates[n - 1];
    const moisObj = {
      version: 1,
      id: moisEntier ? iso(debut).slice(0, 7) : `${iso(debut)}_${n}j`,
      titre: moisEntier ? `${MOIS[debut.getUTCMonth()][0].toUpperCase()}${MOIS[debut.getUTCMonth()].slice(1)} ${debut.getUTCFullYear()}` : `Du ${court(debut)} au ${court(fin)} ${fin.getUTCFullYear()}`,
      debut: iso(debut), fin: iso(fin), jours: n, invites,
      note: "Proposition du moteur.", stockDepart: entrees.stockDepart || {}, share, plan, courses: cr.courses,
    };
    const bilan = {
      nutrition: nut,
      quotas: { poisson: compte("poisson"), plaisir: compte("plaisir"), objectif: quotas, joursPlaisir },
      cout: { consommation: Object.fromEntries(Object.entries(cout).map(([p, v]) => [p, r2(v)])), achats: r2(achats), budget: r2(budget),
              parCourse: cr.courses.map(c => ({ id: c.id, date: c.date, total: r2(c.items.reduce((t, i) => t + i.est, 0)), articles: c.items.length })) },
      manquesAvantPremiereCourse: cr.manquesAvant,
      ruptures: cr.ruptures,
      // les petits-déjeuners sont fixes : leurs dépassements sont signalés à part
      fraisAuDelaConservation: fraisTard.filter(x => x.k !== "pdj"),
      fraisAuDelaPetitDejeuner: fraisTard.filter(x => x.k === "pdj"),
      fraisAVerifier: cr.fraisAVerifier,
      horsFourchette,
      stockFin: cr.stockFin,
      recettesUtilisees: [...new Set(plan.flatMap(j => j.meals.map(m => m.recette)))].length,
    };
    return { mois: moisObj, bilan };
  }

  /* ---------- Réajustement en cours de mois ---------- */
  // Catalogue avec les prix validés (onglet Prix ou prix payés : { aliment: { prix } } ou { aliment: nombre }).
  function avecPrix(catalogue, prix) {
    const cat = {};
    for (const [a, c] of Object.entries(catalogue)) {
      const p = prix && prix[a] != null ? (typeof prix[a] === "object" ? prix[a].prix : prix[a]) : null;
      cat[a] = p != null ? Object.assign({}, c, { prix: p }) : c;
    }
    return cat;
  }
  const estimation = (cat, it) => { const c = cat[it.a]; if (!c || c.prix == null) return 0; return c.vrac ? it.buy / 1000 * c.prix : it.buy * c.prix; };
  const quantiteAchetee = (cat, it) => { const c = cat[it.a]; return c.vrac ? it.buy * (c.rend || 1) : it.buy * c.cond; };

  // Après une ou plusieurs courses : dépensé réel (prix payés, sinon prix validés), estimation des courses restantes
  // aux prix validés, projection face au budget. Si la projection dépasse le budget, les jours à partir de la
  // prochaine course sont recomposés avec le budget qui reste ; les jours déjà couverts ne bougent pas.
  // entrees : celles de composerMois + { mois, prix, payes ({ "c1-Poulet": 21.5 }), aPartirDe (jour de la prochaine course), budget }
  function reajuster(entrees) {
    const m = entrees.mois, reglages = entrees.reglages;
    const cat = avecPrix(entrees.catalogue, entrees.prix || {});
    const payes = entrees.payes || {};
    const aPartirDe = entrees.aPartirDe;
    const budget = entrees.budget;
    const faites = m.courses.filter(c => c.jourPlan < aPartirDe), restantes = m.courses.filter(c => c.jourPlan >= aPartirDe);
    const depenseCourse = c => c.items.reduce((s, it) => { const v = payes[`c${c.id}-${it.a}`]; return s + (v != null ? +v : estimation(cat, it)); }, 0);
    const depense = r2(faites.reduce((s, c) => s + depenseCourse(c), 0));
    // les courses restantes, réestimées aux prix validés
    const reestimees = restantes.map(c => Object.assign({}, c, { items: c.items.map(it => Object.assign({}, it, { est: r2(estimation(cat, it)) })) }));
    const reste = r2(reestimees.reduce((s, c) => s + c.items.reduce((t, it) => t + it.est, 0), 0));
    const projection = r2(depense + reste);
    const bilanBudget = { budget, depense, resteEstime: reste, projection, resteBudget: r2(budget - depense) };
    if (projection <= budget || !restantes.length)
      return { mois: Object.assign({}, m, { courses: faites.concat(reestimees) }), recompose: false, budget: bilanBudget };

    // stock au matin de la prochaine course : départ + achats faits − consommation des jours déjà passés
    const stock = Object.assign({}, m.stockDepart || {});
    for (const c of faites) for (const it of c.items) stock[it.a] = (stock[it.a] || 0) + quantiteAchetee(cat, it);
    const n = m.invites || 0;
    for (const j of m.plan.filter(x => x.d < aPartirDe)) {
      for (const x of j.meals) for (const [qui, f] of [["nicolas", 1], ["aurelie", 1], ["invites", n]]) for (const [a, q] of x.items[qui] || []) stock[a] = (stock[a] || 0) - q * f;
      for (const h of reglages.horsRepas || []) for (const p of PERSONNES) if (h.parJour[p]) stock[h.a] = (stock[h.a] || 0) - h.parJour[p];
    }
    for (const a of Object.keys(stock)) if (stock[a] <= 0.5) delete stock[a]; else stock[a] = r2(stock[a]);

    // quotas restants et historique des jours juste avant, pour l'écart entre deux mêmes plats
    const fixes = m.plan.filter(x => x.d < aPartirDe);
    const tags = id => ((entrees.recettes.find(r => r.id === id) || {}).tags || []);
    const faitsTag = t => fixes.reduce((s, j) => s + j.meals.filter(x => (x.k === "dej" || x.k === "din") && tags(x.recette).includes(t)).length, 0);
    const q0 = entrees.quotas || reglages.quotas;
    const quotas = { poisson: Math.max(0, q0.poisson - faitsTag("poisson")), plaisir: Math.max(0, q0.plaisir - faitsTag("plaisir")) };
    const ecart = reglages.ecartMinJours || 5;
    const historique = fixes.filter(j => j.d >= aPartirDe - ecart).flatMap(j => j.meals.filter(x => x.k === "dej" || x.k === "din").map(x => ({ date: j.date, recette: x.recette })));

    // le coût pèse plus fort qu'à la composition initiale : le menu peut rattraper quelques pour cent, pas davantage
    const suite = composerMois(Object.assign({}, entrees, {
      catalogue: cat, debut: m.plan[aPartirDe - 1].date, jours: m.jours - aPartirDe + 1, invites: n,
      budget: r2(budget - depense), quotas, stockDepart: stock, historique, joursCourses: restantes.map(c => c.date),
      passes: 10, pasCout: 1.2,
    }));
    const projectionApres = r2(depense + suite.bilan.cout.achats);
    // la nouvelle version n'est retenue que si elle coûte vraiment moins ; sinon on garde le planning réestimé
    if (projectionApres >= projection - 1)
      return { mois: Object.assign({}, m, { courses: faites.concat(reestimees) }), recompose: false,
        budget: Object.assign(bilanBudget, { projectionApres, horsDePortee: true }) };
    const decale = aPartirDe - 1;

/* ---------- Constantes ---------- */
const CLES = ["pdj", "dej", "din", "des"];
const COULEUR = { pdj: "var(--c-pdj)", dej: "var(--c-dej)", din: "var(--c-din)", des: "var(--c-des)" };

const HORS_REPAS = { nicolas: [ { a: "Café", q: 1000 }, { a: "Eau (bouteilles 5 L)", q: 42 } ], aurelie: [ { a: "Eau (bouteilles 5 L)", q: 42 } ] };

const DEFAUT = {

  personnes: {

/* ---------- Icônes (tracé type Lucide) ---------- */
const I = (d, cls = "ico") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;

const LOGO = `<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 14h22v6a8 8 0 0 1-8 8h-6a8 8 0 0 1-8-8z" fill="#1B6B4A"/><rect x="3" y="12" width="26" height="4" rx="2" fill="#C9A96E"/><path d="M11 9c0-2 2-2 2-4M16 9c0-2 2-2 2-4M21 9c0-2 2-2 2-4" stroke="#C9A96E" stroke-width="2" fill="none" stroke-linecap="round"/></svg>Marmite`;
const VUES = [ ["jour", "Aujourd'hui"], ["planning", "Planning"], ["courses", "Courses"], ["budget", "Budget"], ["profil", "Profil"] ];

/* ---------- Outils de format ---------- */
const eur = n => (n == null || isNaN(n)) ? "—" : n.toLocaleString("fr-FR", { style: "currency", currency: "EUR" });
const nb = (n, d = 0) => (n == null || isNaN(n)) ? "—" : n.toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d });
const echap = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const nom = (p = actif) => PERSONNES[p].nom;
const de = (p = actif) => /^[AEÉIOU]/i.test(nom(p)) ? "d'" + nom(p) : "de " + nom(p);
function dateDuJour(j) { return new Date(DEBUT.getFullYear(), DEBUT.getMonth(), DEBUT.getDate() + j - 1); }
const jourMoisCourt = j => { const d = dateDuJour(j); return (d.getDate() === 1 ? "1er" : d.getDate()) + " " + d.toLocaleDateString("fr-FR", { month: "long" }); };
function libelleJour(j) {
  const t = dateDuJour(j).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  return cap(t.replace(/^(\S+) 1 /, "$1 1er "));
}
// course en cours : la dernière dont le jour est passé (la première avant le début du plan)
// Courses du cycle : celles des données, ou, après « Générer le menu selon le stock », les courses gardées
// (déjà commencées) suivies des courses recalculées par le moteur.
function COURSES() {
  const g = E.foyer.generation;
  if (!g) return BASE_COURSES;
  // courses gardées ; celles déjà passées au moment de refaire le planning ne gardent que les articles cochés
  // (le reste n'a pas été trouvé en rayon ou a été laissé volontairement)
  return BASE_COURSES.filter(c => g.gardees.includes(c.id))
    .map(c => c.jourPlan <= (g.jourRefait || 0) ? { ...c, items: c.items.filter(it => E.foyer.achats[cleArticle(c.id, it.a)]) } : c)
    .concat(g.courses);
}
function courseDuJour() { const j = planPasCommence() ? 1 : jourDuPlan(); let id = COURSES()[0].id; for (const c of COURSES()) if (c.jourPlan <= j) id = c.id; return id; }
const dateCourte = iso => new Date(iso + "T12:00:00").toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }).replace(/^(\S+) 1 /, "$1 1er ");
function jourDuPlan() {
  const n = new Date(), t = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  return Math.min(Math.max(Math.floor((t - DEBUT) / 864e5) + 1, 1), NB_JOURS);
}
function planPasCommence() { return new Date() < DEBUT; }
function uniteDe(a) { if (UNITES_SPECIALES[a]) return UNITES_SPECIALES[a]; const n = DONNEES.nut[a]; return n ? n[1] : "g"; }
function quantite(a, q) {
  const u = uniteDe(a), r = Math.round(q * 10) / 10;
  if (a === "Œufs") return nb(r, r % 1 ? 1 : 0) + (r > 1 ? " œufs" : " œuf");
  if (a === "Wraps") return nb(r, r % 1 ? 1 : 0) + (r > 1 ? " wraps" : " wrap");
  if (a === "Pains burger") return nb(r, r % 1 ? 1 : 0) + (r > 1 ? " pains" : " pain");
  if (u === "g") return q >= 1000 ? nb(q / 1000, 2) + " kg" : nb(q) + " g";
  if (u === "ml") return q >= 1000 ? nb(q / 1000, 2) + " L" : nb(q) + " ml";
  if (u === "L") return nb(q) + " L";
  return nb(r, r % 1 ? 1 : 0) + " " + u;
}
const P = (p = actif) => E.personnes[p];

/* ---------- Thème clair / sombre ---------- */
function themeEffectif() {
  const t = document.documentElement.dataset.theme;
  if (t === "light" || t === "dark") return t;
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
// Plein écran : l'app occupe tout l'écran et masque la barre de claude.ai (navigateurs d'ordinateur ;
// les téléphones et certaines apps ne le permettent pas, le bouton n'apparaît alors pas).

}
function basculerPleinEcran() {
  const fin = () => rendreCadre();
  try {
    const r = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    if (r && r.then) r.then(fin, () => toast("Le plein écran n'est pas autorisé ici"));
  } catch (e) { toast("Le plein écran n'est pas autorisé ici"); }
}

function boutonTheme() {

  return `<button class="theme" data-action="theme" aria-label="${sombre ? "Passer en mode clair" : "Passer en mode sombre"}">${sombre ? ICONES.soleil : ICONES.lune}<span>${sombre ? "Clair" : "Sombre"}</span></button>`;
}

/* ---------- Prix, nutrition, coûts ---------- */
function fiche(a) { const c = DONNEES.cat[a]; if (!c) return null; const p = E.foyer.prix[a]; return p ? { ...c, prix: p.prix } : c; }
function prixUnitaire(a) { const c = fiche(a); if (!c || c.prix == null) return null; return c.vrac ? c.prix / 1000 / (c.rend || 1) : c.prix / c.cond; }
function nutrition(a, q) { const n = DONNEES.nut[a]; if (!n) return null; return { kcal: q / n[0] * n[2], prot: q / n[0] * n[3] }; }
function repasPlan(j, k, p = actif) {
  const m = PLAN[j - 1].meals.find(x => x.k === k);
  return { k, label: m.label, plat: m.plat[p], items: m.items[p] };
}
function repasDe(j, k, p = actif) {
  const r = P(p).remplacements["d" + j + "-" + k];
  return r || repasPlan(j, k, p);
}
function statsRepas(m) {
  let kcal = 0, prot = 0, cout = 0, inconnu = false;
  for (const [a, q] of m.items) {
    const n = nutrition(a, q); if (n) { kcal += n.kcal; prot += n.prot; }
    const pu = prixUnitaire(a); if (pu == null) inconnu = true; else cout += pu * q;
  }
  return { kcal, prot, cout, inconnu };
}
function horsRepasJour(p = actif) { return (DONNEES.reglages.horsRepas || []).reduce((s, h) => s + (prixUnitaire(h.a) || 0) * (h.parJour[p] || 0), 0); }
function statsJour(j, p = actif) {
  const r = { kcal: 0, prot: 0, cout: 0, kcalFait: 0, coutFait: 0, faits: 0 };
  for (const k of CLES) {
    const s = statsRepas(repasDe(j, k, p)), f = !!P(p).coches["d" + j + "-" + k];
    r.kcal += s.kcal; r.prot += s.prot; r.cout += s.cout;
    if (f) { r.kcalFait += s.kcal; r.coutFait += s.cout; r.faits++; }
  }
  return r;
}
function totalPrevu(p = actif) { let t = 0; for (let j = 1; j <= NB_JOURS; j++) t += statsJour(j, p).cout; return t + horsRepasJour(p) * NB_JOURS; }

/* ---------- Stock estimé du foyer ---------- */
function quantiteUtile(it) { const c = DONNEES.cat[it.a]; return c.vrac ? it.buy * (c.rend || 1) : it.buy * c.cond; }
// Stock au matin du jour j (j = 22 : fin du cycle). planSeul = sans les ajustements ni remplacements.
function stockBrut(j, planSeul = false) {
  const s = {};
  Object.assign(s, STOCK_DEPART);
  for (const c of COURSES()) if (c.jourPlan <= j) for (const it of (planSeul ? c.items : itemsCourse(c))) s[it.a] = (s[it.a] || 0) + quantiteUtile(it);
  for (let d = 1; d < j && d <= NB_JOURS; d++) for (const p of Object.keys(PERSONNES)) for (const k of CLES)
    for (const [a, q] of (planSeul ? repasPlan(d, k, p) : repasDe(d, k, p)).items) s[a] = (s[a] || 0) - q;
  retirerInvites(s, j);
  // produits jetés (poubelle de l'onglet « À la maison ») : retirés à partir du jour où ils l'ont été
  if (!planSeul) for (const x of E.foyer.pertes || []) if (x.j <= j) s[x.a] = (s[x.a] || 0) - x.q;
  return s;
}
// Stock réel au matin du jour j : stock de départ + articles cochés (quantité achetée) − repas des jours passés − poubelle.
// Un article non coché n'est pas à la maison.
function stockReel(j) {
  const s = {};
  Object.assign(s, STOCK_DEPART);
  for (const c of COURSES()) for (const it of itemsCourse(c)) if (E.foyer.achats[cleLigne(c.id, it)]) s[it.a] = (s[it.a] || 0) + quantiteUtile(it);
  for (let d = 1; d < j && d <= NB_JOURS; d++) for (const p of Object.keys(PERSONNES)) for (const k of CLES)
    for (const [a, q] of repasDe(d, k, p).items) s[a] = (s[a] || 0) - q;
  retirerInvites(s, j);
  for (const x of E.foyer.pertes || []) if (x.j <= j) s[x.a] = (s[x.a] || 0) - x.q;
  return s;
}
// invités du mois (préparé avec des invités) : leurs portions sortent aussi du stock
function retirerInvites(s, j) {
  if (!INVITES) return;
  for (let d = 1; d < j && d <= NB_JOURS; d++) for (const m of PLAN[d - 1].meals) for (const [a, q] of (m.items.invites || [])) s[a] = (s[a] || 0) - q * INVITES;
}
function stockAuDebut(j) {
  const s = stockBrut(j);
  for (const a of Object.keys(s)) if (s[a] <= 0.5) delete s[a];
  return s;
}

/* ---------- Courses ---------- */
function texteAchat(it) { const c = DONNEES.cat[it.a]; return c.vrac ? quantite(it.a, it.buy) + " en vrac" : it.buy + " × " + c.achat; }
function est0(it) { const c = DONNEES.cat[it.a]; if (!c || c.prix == null) return null; return c.vrac ? it.buy / 1000 * c.prix : it.buy * c.prix; }
function estimationLigne(it) { const c = fiche(it.a); if (!c || c.prix == null) return null; return c.vrac ? it.buy / 1000 * c.prix : it.buy * c.prix; }
function cleArticle(cid, a) { return "c" + cid + "-" + a; }
// clé d'une ligne : un produit de remplacement garde la trace de celui qu'il remplace (« Courgettes~Poivrons »)
function cleLigne(cid, it) { return cleArticle(cid, it.remplace ? it.a + "~" + it.remplace : it.a); }
// Articles d'une course après les décisions prises face à un dépassement (retraits, échanges)
function itemsCourse(c) {
  const out = [];
  for (const it of c.items) {
    const m = (E.foyer.modifs || []).find(x => x.cid === c.id && x.a === it.a);
    const l = !m ? it : m.type === "substitution" ? ligneSubstitut(it, m) : null;
    if (!l) continue;
    // quantité achetée modifiée sur la ligne (dans l'unité d'achat : conditionnements, ou grammes en vrac)
    const q = (E.foyer.quantites || {})[cleLigne(c.id, l)];
    out.push(q != null ? { ...l, prevu: l.buy, buy: q } : l);
  }
  return out;
}
// montant d'une ligne : prix payé s'il est tapé, sinon prix du moment × quantité achetée
function montantLigne(cid, it) { const v = E.foyer.payes[cleLigne(cid, it)]; return v != null && v !== "" ? +v : (estimationLigne(it) || 0); }
function ligneSubstitut(it, m) {
  const c = DONNEES.cat[m.b], needN = it.needN * m.f, needA = it.needA * m.f, need = needN + needA;
  const buy = c.vrac ? Math.ceil(need / (c.rend || 1) / 50) * 50 : Math.max(1, Math.ceil(need / c.cond - 1e-9));
  return { a: m.b, buy, needN, needA, remplace: it.a };
}
function part(a, p = actif) { const s = SHARE[a]; const n = s == null ? 0.5 : s; return p === "nicolas" ? n : 1 - n; }
function bilanCourse(cid, p = actif) {
  const c = COURSES().find(x => x.id === cid);
  let est = 0, maPart = 0, paye = 0, partPaye = 0, faits = 0;
  // une case cochée vaut prix validé : le montant de la ligne devient réel (payé)
  const items = itemsCourse(c);
  for (const it of items) {
    const e = montantLigne(cid, it); est += e; maPart += e * part(it.a, p);
    if (E.foyer.achats[cleLigne(cid, it)]) { faits++; paye += e; partPaye += e * part(it.a, p); }
  }
  return { est, maPart, paye, partPaye, avenir: est - paye, faits, total: items.length };
}

/* ---------- Sauvegarde : compte en ligne puis appareil ---------- */
let minuterie = null, enCours = false, encore = false;
function charger(obj) {
  if (!obj || typeof obj !== "object") return;
  // copie profonde : les données du compte en ligne peuvent arriver verrouillées en écriture ; sans copie,
  // cocher une case ou saisir un prix échouait sans bruit (c'était le bug des cases qui ne se cochaient pas)
  obj = JSON.parse(JSON.stringify(obj));
  if (!obj.version) { // migration depuis la première version (Nicolas seul)
    const n = E.personnes.nicolas;
    if (obj.coches) n.coches = obj.coches;
    if (obj.remplacements) n.remplacements = obj.remplacements;
    if (obj.pesees) n.pesees = obj.pesees;
    if (obj.profil) n.profil = { ...n.profil, ...obj.profil };
    for (const k of ["achats", "payes", "prix", "magasins"]) if (obj[k]) E.foyer[k] = obj[k];
    return;
  }
  E.foyer = { ...structuredClone(DEFAUT.foyer), ...(obj.foyer || {}) };
  E.mois = obj.mois || null; E.archives = obj.archives || {};
  for (const p of Object.keys(PERSONNES)) {
    const src = (obj.personnes || {})[p] || {}, d = structuredClone(DEFAUT.personnes[p]);
    E.personnes[p] = { ...d, ...src, profil: { ...d.profil, ...(src.profil || {}) } };
  }
  activerMois();
}
try { const l = localStorage.getItem("marmite-nicolas"); if (l) charger(JSON.parse(l)); } catch (e) {}
function sauver() {
  try { localStorage.setItem("marmite-nicolas", JSON.stringify(E)); } catch (e) {}
  clearTimeout(minuterie); minuterie = setTimeout(envoyer, 800);
}
async function envoyer() {
  if (!refDoc) return;
  if (enCours) { encore = true; return; }
  enCours = true;
  try { await refDoc.set(JSON.parse(JSON.stringify(E))); sync = "compte"; } catch (e) { sync = "hors-ligne"; }
  enCours = false;
  if (encore) { encore = false; envoyer(); }
}
async function brancherCompte() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    refDoc = db.doc("data/users/" + id + "/marmite");
    const snap = await refDoc.get();
    if (snap.exists) { charger(snap.data()); try { localStorage.setItem("marmite-nicolas", JSON.stringify(E)); } catch (e) {} }
    E.version = 2;
    await refDoc.set(JSON.parse(JSON.stringify(E)));
    sync = "compte"; rendre();
  } catch (e) { sync = "hors-ligne"; rendre(); }
}

/* ---------- Vue : jour ---------- */
function assietteSVG(j) {

/* ---------- Changer un repas de la proposition : bibliothèque filtrée ---------- */
let choix = null;   // { cle: "j-k", filtre, q }
const familleDe = r => (r.nom || r.id).split(/[,(+]/)[0].trim().toLowerCase();
function candidatsChoix() {
  const [j, k] = choix.cle.split("-"), d = +j, plan = gen.res.mois.plan;
  const estPrincipal = k === "dej" || k === "din";
  let l = DONNEES.recettes.filter(r => r.repas.includes(k) || (estPrincipal && (r.repas.includes("dej") || r.repas.includes("din"))));
  if (estPrincipal) l = l.filter(r => r.portions.nicolas.some(([a]) => DONNEES.catalogue[a] && DONNEES.catalogue[a].animal));
  const f = choix.filtre, q = choix.q.trim().toLowerCase();
  if (f === "poisson") l = l.filter(r => r.tags.includes("poisson"));
  if (f === "plaisir") l = l.filter(r => r.tags.includes("plaisir"));
  if (f === "viande") l = l.filter(r => !r.tags.includes("poisson"));
  if (q) l = l.filter(r => (r.nom || "").toLowerCase().includes(q));
  // même famille de plat déjà prévue à moins de 5 jours : signalé, pas interdit
  const ecart = DONNEES.reglages.ecartMinJours || 5, proches = {};
  for (const jj of plan) for (const m of jj.meals) {
    if (`${jj.d}-${m.k}` === choix.cle || !(m.k === "dej" || m.k === "din") || Math.abs(jj.d - d) >= ecart) continue;
    const r = DONNEES.recettes.find(x => x.id === m.recette); if (r) (proches[familleDe(r)] = proches[familleDe(r)] || []).push(jj.d);
  }
  return l.map(r => ({ r, proche: estPrincipal ? proches[familleDe(r)] : null,
    cout: ["nicolas", "aurelie"].reduce((s, p) => s + r.portions[p].reduce((t, [a, x]) => t + (prixUnitaire(a) || 0) * x, 0), 0) }))
    .sort((a, b) => (!!a.proche - !!b.proche) || (a.r.nom || "").localeCompare(b.r.nom || "", "fr"));
}
function listeChoix() {
  const [j, k] = choix.cle.split("-"), actuel = gen.res.mois.plan.find(x => x.d === +j).meals.find(m => m.k === k).recette;
  const l = candidatsChoix();
  if (!l.length) return `<li class="discret petit" style="padding:12px 0">Aucun plat ne correspond.</li>`;
  const dateDe = jj => { const x = gen.res.mois.plan.find(y => y.d === jj); return x && x.date ? dateLocale(x.date).getDate() : jj; };
  return l.map(({ r, proche, cout }) => `<li><button class="choix-plat ${r.id === actuel ? "actuel" : ""}" data-choix-id="${echap(r.id)}">
    <b>${echap(r.nom || r.id)}</b>

}

function remplacerRepas(id) {
  const old = gen.res, g = Moteur.grilleDuMois(old.mois);
  g[choix.cle] = id;
  const res = Moteur.composerMois({ ...old.entrees, grilleImposee: g });
  res.entrees = old.entrees;
  if (old.stock) { Object.assign(res, { stock: old.stock, gardees: old.gardees }); completerStock(res); }
  gen.res = res; gen.confirmer = false;
  const r = DONNEES.recettes.find(x => x.id === id);
  choix = null; rendreChoix(); rendre(); toast("Repas changé : " + (r.nom || id));
}

function vuePlanning() {

  const decal = (dateDuJour(1).getDay() + 6) % 7;
  for (let i = 0; i < decal; i++) cases += `<div class="case-j vide" aria-hidden="true"></div>`;
  let faits = 0;
  for (let j = 1; j <= NB_JOURS; j++) {
    const jour = PLAN[j - 1], st = statsJour(j); faits += st.faits;
    const barres = CLES.map(k => `<i style="--c:${COULEUR[k]}" class="${P().coches["d" + j + "-" + k] ? "ok" : ""}"></i>`).join("");
    const marques = (jour.tag === "plaisir" ? ICONES.etoile : "") + (jour.fish ? ICONES.poisson : "") + (COURSES().some(c => c.jourPlan === j) ? ICONES.panier : "");
    cases += `<button class="case-j ${commence && j < auj ? "passe" : ""}" data-voir="${j}" ${commence && j === auj ? 'aria-current="date"' : ""} aria-label="${libelleJour(j)} : ${st.faits} repas sur 4 faits">

  }
  const total = NB_JOURS * 4;

  <p class="discret" style="margin:6px 0 0">${MOIS_TITRE} : du ${libelleJour(1).toLowerCase()} au ${libelleJour(NB_JOURS).toLowerCase()}. Touche un jour pour voir ses repas.</p>

  ${carteMois()}

}

/* ---------- Vue : courses ---------- */
function vueStock(seg) {
  const jNow = planPasCommence() ? 1 : jourDuPlan();
  const now = stockReel(jNow), fin = stockBrut(NB_JOURS + 1);
  const alim = Object.keys(DONNEES.nut).filter(a => DONNEES.cat[a] && (now[a] > 0.5 || fin[a] != null));
  let manques = 0, valeur = 0;
  const lignes = alim.map(a => {
    const n = Math.max(0, now[a] || 0), f = fin[a] || 0;
    if (f < -0.5) manques++; valeur += n * (prixUnitaire(a) || 0);
    return { a, n, f };
  }).sort((x, y) => (x.f < -0.5 ? x.f : 0) - (y.f < -0.5 ? y.f : 0) || (y.n > 0.5) - (x.n > 0.5) || x.a.localeCompare(y.a, "fr"));
  const aujourdhui = cap(new Date().toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }).replace(/^(\S+) 1 /, "$1 1er "));
  let adj = 0, dk = 0, dc = 0;
  for (let j = 1; j <= NB_JOURS; j++) for (const k of CLES) { const r = P().remplacements["d" + j + "-" + k]; if (r && r.ajuste) { adj++; const x = statsRepas(r), y = statsRepas(repasPlan(j, k)); dk += x.kcal - y.kcal; dc += x.cout - y.cout; } }
  return `<h1>Courses du foyer</h1>
  <div class="segments" role="group" aria-label="Choisir la liste">${seg}</div>
  <div class="totaux">
    <div><span class="chiffre ${manques ? "surcout" : "eco"}">${manques}</span><span class="discret">aliment${manques > 1 ? "s" : ""} en rupture avant le ${dateDuJour(NB_JOURS).getDate()}</span></div>
    <div><span class="chiffre">${eur(valeur)}</span><span class="discret">à la maison aujourd'hui</span></div>
    <div><span class="chiffre">${adj}</span><span class="discret">repas ajustés ${de()} (${dk >= 0 ? "+" : "−"}${nb(Math.abs(dk))} kcal)</span></div>
  </div>
  <p class="discret petit">Ce qu'il reste à la maison aujourd'hui : articles cochés aux courses, moins les repas des jours passés et la poubelle. La dernière colonne prévoit la fin du cycle avec toutes les courses de la liste.</p>
  <div class="stock-ligne stock-tete"><span>Aliment</span><span class="n">${aujourdhui}</span><span class="n">Le ${dateDuJour(NB_JOURS).getDate()} au soir</span><span></span></div>
  ${lignes.map(l => `<div class="stock-ligne"><span>${echap(l.a)}</span><span class="n">${quantite(l.a, l.n)}</span>
    <span class="n ${l.f < -0.5 ? "manque" : ""}">${l.f < -0.5 ? "manque " + quantite(l.a, -l.f) : quantite(l.a, Math.max(0, l.f))}</span>
    ${l.n > 0.5 ? `<button class="jeter" data-jeter="${echap(l.a)}" aria-label="Jeter du stock : ${echap(l.a)}">${ICONES.poubelle}</button>` : "<span></span>"}
    ${jeterSel === l.a ? `<div class="jeter-form"><label>Jeter <input id="jeter-q" type="number" inputmode="decimal" min="0" step="any" value="${Math.round(l.n * 10) / 10}"> ${uniteDe(l.a)}</label>
      <button class="bouton" data-jeter-ok="${echap(l.a)}">Mettre à la poubelle</button><button class="bouton leger" data-jeter-annuler="1">Annuler</button></div>` : ""}</div>`).join("")}
  ${vuePertes()}`;
}
let jeterSel = null;
function vuePertes() {
  const l = E.foyer.pertes || [];

  const total = l.reduce((s, x) => s + x.q * (prixUnitaire(x.a) || 0), 0);
  return `<div class="carte pertes"><div class="sect-titre"><h3>À la poubelle</h3><span class="chiffre surcout">${eur(total)}</span></div>
    <ul>${l.map((x, i) => `<li><span>${echap(x.a)} · ${quantite(x.a, x.q)} <span class="discret">${libelleJour(x.j).toLowerCase()}</span></span>

}
// Onglet « Prix » : prix de chaque produit, modifiable. Un prix saisi (ou payé) remplace celui du catalogue partout.
function vuePrix(seg) {
  const groupes = {};
  for (const [a, c] of Object.entries(DONNEES.cat)) { if (c.cat === "Déjà en stock") continue; (groupes[c.cat] = groupes[c.cat] || []).push(a); }
  const date = s => new Date(s + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "long" });
  let liste = "", modifies = 0;
  for (const [rayon, alim] of Object.entries(groupes)) {
    liste += `<h3 class="cat-titre">${echap(rayon)}</h3>`;
    for (const a of alim) {
      const c = DONNEES.cat[a], p = E.foyer.prix[a], cat = (DONNEES.catalogue || {})[a] || {};
      if (p) modifies++;
      const unite = c.vrac ? "€/kg" : "€";
      const pour = c.vrac ? (c.rend && c.rend < 1 ? `au kilo brut (rendement ${nb(c.rend * 100)} %)` : "au kilo") : c.achat;
      const origine = p ? `${p.source === "paye" ? "d'après le prix payé" : "modifié"} le ${date(p.date)} · catalogue ${c.prix == null ? "sans prix" : nb(c.prix, 2) + " " + unite}` : (c.prix == null ? "pas encore de prix" : "");
      liste += `<div class="prix-ligne"><div><div class="nom">${echap(a)}${!p && cat.prixEstime ? '<span class="etiq-estime">estimé</span>' : ""}</div>
        <div class="detail">${echap(pour)}${origine ? " · " + echap(origine) : ""}${p ? ` · <button class="lien" data-prix-reset="${echap(a)}">Rétablir</button>` : ""}</div></div>
        <label class="saisie-prix"><input type="number" inputmode="decimal" step="0.01" min="0" data-prix-a="${echap(a)}" class="${p ? "modifie" : ""}"
          value="${p ? p.prix : (c.prix == null ? "" : c.prix)}" placeholder="0,00" aria-label="Prix de ${echap(a)} en ${unite}"> ${unite}</label></div>`;
    }
  }
  return `<h1>Courses du foyer</h1>
  <div class="segments" role="group" aria-label="Choisir la liste">${seg}</div>
  <p class="discret petit">Prix au conditionnement, ou au kilo pour le vrac. Un prix modifié ici, ou déduit d'un prix payé, remplace le prix d'origine dans toute l'app : courses, budget, coût des repas et propositions du chef.${modifies ? ` ${modifies} prix modifié${modifies > 1 ? "s" : ""}.` : ""}</p>

// Projection des courses du cycle : prix payés quand ils sont saisis, sinon estimation aux derniers prix validés.
function projectionFoyer() {
  let paye = 0, avenir = 0;
  for (const c of COURSES()) { const b = bilanCourse(c.id); paye += b.paye; avenir += b.avenir; }
  const budget = budgetFoyer();
  return { paye, avenir, total: paye + avenir, budget };
}
// Budget du foyer : celui choisi pour le mois préparé par le chef, sinon la somme des budgets des profils.
// La part d'une personne suit le rapport de son budget de profil.
function budgetFoyer() { return E.mois && E.mois.budget ? +E.mois.budget : Object.keys(PERSONNES).reduce((s, p) => s + (+E.personnes[p].profil.budget || 0), 0); }
function budgetPersonne(p = actif) {
  const b = +E.personnes[p].profil.budget || 0; if (!(E.mois && E.mois.budget)) return b;
  const tot = Object.keys(PERSONNES).reduce((s, q) => s + (+E.personnes[q].profil.budget || 0), 0);
  return tot ? E.mois.budget * b / tot : E.mois.budget / 2;
}
// Dépassement du foyer : ce qui sera mangé sur le cycle (aux derniers prix validés) face à la somme des budgets.

function depassementFoyer() {

}
function ligneProjection() {

    Achats du cycle : ${eur(d.paye)} payés + ${eur(d.avenir)} à venir aux derniers prix (${eur(d.achats)}).</span></p>${panneauDepassement()}`;
