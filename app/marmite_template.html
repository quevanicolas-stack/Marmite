<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marmite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<script>
/* Thème choisi sur cet appareil, appliqué avant l'affichage */
try { const t = localStorage.getItem("marmite-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/* ---------- Palette Fluent & Forward ---------- */
:root{
  --vert:#1B6B4A; --profond:#10382A; --or:#C9A96E; --sable:#E8DDD0; --creme:#FAF7F2; --encre-ff:#2C1810;
  --fond:var(--creme); --surface:#FFFFFF; --surface-2:#F2EBE0; --trait:#E8DDD0; --encre:var(--encre-ff); --brume:#7A6A5E;
  --primaire:var(--vert); --sur-primaire:#FAF7F2; --accent:var(--or); --titre-c:var(--profond);
  --c-pdj:#C9A96E; --c-dej:#1B6B4A; --c-din:#5E9C7F; --c-des:#9C7A45;
  --alerte:#A2412B; --ok:#1B6B4A; --ombre:0 1px 0 rgba(44,24,16,.06);
  --titre:"Plus Jakarta Sans", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --texte:"DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fond:#10382A; --surface:#15432F; --surface-2:#1C5039; --trait:#2A614A; --encre:#FAF7F2; --brume:#CDBFAE;
    --primaire:#C9A96E; --sur-primaire:#10382A; --titre-c:#FAF7F2;
    --c-pdj:#C9A96E; --c-dej:#6FB896; --c-din:#A8D5BF; --c-des:#E3C893;
    --alerte:#F0A089; --ok:#8FD1AF; --ombre:0 1px 0 rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --fond:#10382A; --surface:#15432F; --surface-2:#1C5039; --trait:#2A614A; --encre:#FAF7F2; --brume:#CDBFAE;
  --primaire:#C9A96E; --sur-primaire:#10382A; --titre-c:#FAF7F2;
  --c-pdj:#C9A96E; --c-dej:#6FB896; --c-din:#A8D5BF; --c-des:#E3C893;
  --alerte:#F0A089; --ok:#8FD1AF; --ombre:0 1px 0 rgba(0,0,0,.25);
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; min-height:100%; background:var(--fond); color:var(--encre); font:16px/1.5 var(--texte); -webkit-font-smoothing:antialiased; transition:background .25s; }
button,input,select{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--or); outline-offset:2px; border-radius:6px; }
svg{ max-width:100%; }
.ico{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; flex:none; }

/* ---------- Mise en page ---------- */
.app{ display:grid; min-height:100vh; }
.app > div, main{ min-width:0; }
.rail{ display:none; }
.hautbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 18px 0; max-width:760px; margin:0 auto; }
main{ padding:14px 18px 110px; max-width:760px; width:100%; margin:0 auto; }
.barre{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--trait);
  display:grid; grid-template-columns:repeat(5,1fr); padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px)); }
.barre button,.rail .nav button{ background:none; border:0; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px;
  font-size:12px; font-weight:700; color:var(--brume); border-radius:12px; }
.barre button[aria-current="page"],.rail .nav button[aria-current="page"]{ color:var(--titre-c); }
.barre button[aria-current="page"] .ico{ stroke:var(--or); }
@media (min-width:960px){
  .app{ grid-template-columns:232px 1fr; }
  .barre,.hautbar{ display:none; }
  .rail{ display:flex; flex-direction:column; gap:18px; position:sticky; top:0; height:100vh; padding:28px 16px; background:var(--surface); border-right:1px solid var(--trait); }
  .rail .nav{ display:flex; flex-direction:column; gap:4px; }
  .rail .nav button{ flex-direction:row; gap:12px; font-size:15px; padding:10px 12px; justify-content:flex-start; }
  .rail .nav button[aria-current="page"]{ background:var(--surface-2); }
  .rail .bas{ margin-top:auto; }
  main{ padding:34px 40px 60px; max-width:1060px; }
}
.marque{ font-family:var(--titre); font-weight:800; font-size:22px; letter-spacing:-.02em; color:var(--titre-c); display:flex; align-items:center; gap:8px; }
.marque svg{ width:28px; height:28px; flex:none; }
@media (max-width:400px){ .hautbar{ padding:12px 16px 0; gap:6px; } .hautbar .marque{ font-size:18px; gap:5px; } .hautbar .marque svg{ width:22px; height:22px; } .qui button{ padding:6px 9px; font-size:13px; } .hautbar .theme{ padding:7px 9px; } }
.qui{ display:grid; grid-template-columns:1fr 1fr; background:var(--surface-2); border-radius:999px; padding:3px; }
.qui button{ border:0; background:none; border-radius:999px; padding:6px 12px; font-weight:700; font-size:14px; color:var(--brume); }
.qui button[aria-pressed="true"]{ background:var(--primaire); color:var(--sur-primaire); }
.theme{ display:inline-flex; align-items:center; gap:8px; border:1px solid var(--trait); background:var(--surface); border-radius:999px; padding:7px 12px; font-weight:700; font-size:14px; }
.theme .ico{ width:18px; height:18px; }
.hautbar .theme span{ display:none; }
@media (min-width:420px){ .hautbar .theme span{ display:inline; } }

/* ---------- Typographie ---------- */
h1,h2,h3{ font-family:var(--titre); letter-spacing:-.015em; margin:0; color:var(--titre-c); }
h1{ font-size:clamp(28px,6vw,40px); font-weight:800; line-height:1.05; }
h2{ font-size:22px; font-weight:700; }
h3{ font-size:18px; font-weight:700; }
.discret{ color:var(--brume); }
.petit{ font-size:14px; }
.chiffre{ font-family:var(--titre); font-weight:700; font-variant-numeric:tabular-nums; }

/* ---------- En-tête du jour ---------- */
.entete{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:8px 0 6px; }
.nav-jour{ display:flex; gap:6px; }
.rond{ width:42px; height:42px; border-radius:50%; border:1px solid var(--trait); background:var(--surface); display:grid; place-items:center; padding:0; }
.rond:disabled{ opacity:.4; cursor:default; }
.bandeau{ margin:10px 0 0; padding:10px 14px; border-radius:14px; background:var(--surface-2); font-size:14px; display:flex; gap:10px; align-items:center; }
.bandeau .ico{ width:20px; height:20px; color:var(--or); }

/* ---------- Bilan du jour (bande collante) ---------- */
.bilan-mini{ position:sticky; top:env(safe-area-inset-top,0px); z-index:15; margin:10px -8px 0; padding:6px 8px;
  background:color-mix(in srgb, var(--fond) 82%, transparent); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border-radius:0 0 18px 18px; }
.bilan-tete{ width:100%; display:flex; align-items:center; gap:12px; background:var(--surface); border:0; border-radius:16px; padding:6px 12px 6px 6px; box-shadow:var(--ombre); color:var(--encre); text-align:left; }
.bilan-tete .anneau{ width:40px; height:40px; flex:none; }
.bilan-tete .anneau .arc{ transition:stroke-opacity .5s ease, stroke-width .5s ease; }
@media (prefers-reduced-motion:reduce){ .bilan-tete .anneau .arc, body{ transition:none; } }
.bilan-val{ display:flex; align-items:baseline; gap:4px; min-width:0; font-variant-numeric:tabular-nums; white-space:nowrap; }
.bilan-val b{ font-family:var(--titre); font-size:16px; font-weight:700; }
.bilan-val small{ font-size:12px; color:var(--brume); }
.bilan-tete > .ico{ margin-left:auto; width:18px; height:18px; color:var(--brume); flex:none; transition:transform .2s ease; }
.bilan-tete[aria-expanded="true"] > .ico{ transform:rotate(180deg); }
.bilan-plus{ margin:6px 4px 2px; font-size:13px; color:var(--brume); }
@media (max-width:380px){ .bilan-tete{ gap:8px; } .bilan-val small{ font-size:11px; } .bilan-val b{ font-size:15px; } }
.repas-jour{ margin-top:14px; }
.repas-jour .faim{ margin:12px 0; }
.barre-prog{ height:6px; border-radius:6px; background:var(--surface-2); overflow:hidden; margin-top:6px; }
.barre-prog i{ display:block; height:100%; border-radius:6px; }

/* ---------- Repas ---------- */
.repas{ background:var(--surface); border-radius:18px; padding:16px 16px 12px 22px; position:relative; box-shadow:var(--ombre); }
.repas + .repas{ margin-top:12px; }
.repas::before{ content:""; position:absolute; left:0; top:14px; bottom:14px; width:6px; border-radius:0 6px 6px 0; background:var(--couleur); }
.repas.fait{ background:color-mix(in srgb, var(--couleur) 12%, var(--surface)); }
.repas-type{ font-size:13px; font-weight:700; color:var(--brume); }
.repas h3{ margin-top:2px; overflow-wrap:anywhere; }
.repas{ min-width:0; }
.pastille{ display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--titre-c); margin-top:6px; }
.pastille .ico{ width:13px; height:13px; }
.ingredients{ list-style:none; padding:0; margin:10px 0 8px; display:grid; grid-template-columns:1fr auto; column-gap:14px; row-gap:3px; font-size:15px; }
.ingredients li{ display:contents; }
.ingredients .q{ text-align:right; font-variant-numeric:tabular-nums; color:var(--brume); }
.repas-pied{ display:flex; align-items:center; justify-content:space-between; gap:8px; border-top:1px dashed var(--trait); padding-top:10px; flex-wrap:wrap; }
.repas-pied .infos{ display:flex; gap:12px; font-size:13px; color:var(--brume); }
.repas-pied .infos b{ font-weight:700; color:var(--encre); }
.repas.moment{ box-shadow:var(--ombre), 0 0 0 2px color-mix(in srgb, var(--couleur) 55%, transparent); }
.repas-type{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.maintenant{ font-size:11px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--surface); background:var(--couleur); border-radius:999px; padding:2px 8px; }
.repas-type .replier{ margin-left:auto; font-size:13px; }
.repas.replie{ padding:0; }
.repas.replie::before{ top:10px; bottom:10px; }
.replie-tete{ width:100%; display:flex; align-items:center; gap:10px; background:none; border:0; padding:10px 14px 10px 20px; text-align:left; color:var(--encre); border-radius:18px; }
.replie-tete .ok{ width:24px; height:24px; flex:none; border-radius:50%; background:var(--couleur); display:grid; place-items:center; }
.replie-tete .ok .ico{ width:14px; height:14px; stroke:var(--surface); stroke-width:3; }
.replie-txt{ min-width:0; flex:1; display:flex; flex-direction:column; }
.replie-txt .repas-type{ font-size:12px; }
.replie-plat{ font-weight:700; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.replie-kcal{ font-size:13px; color:var(--brume); white-space:nowrap; font-variant-numeric:tabular-nums; }
.replie-tete > .ico{ width:18px; height:18px; color:var(--brume); flex:none; }
.coche{ display:inline-flex; align-items:center; gap:8px; border:2px solid var(--couleur); background:transparent; border-radius:999px; padding:6px 14px 6px 8px; font-weight:700; font-size:14px; }
.coche .case{ width:22px; height:22px; border-radius:50%; border:2px solid var(--couleur); display:grid; place-items:center; }
.coche .case .ico{ width:14px; height:14px; opacity:0; stroke-width:3; }
.coche[aria-pressed="true"]{ background:var(--couleur); color:var(--surface); }
.coche[aria-pressed="true"] .case{ background:var(--surface); border-color:var(--surface); }
.coche[aria-pressed="true"] .case .ico{ opacity:1; stroke:var(--couleur); }
.lien{ background:none; border:0; color:var(--titre-c); text-decoration:underline; text-decoration-color:var(--or); text-underline-offset:3px; font-weight:700; padding:6px 4px; font-size:14px; }

/* ---------- Ajustement d'un repas ---------- */
.repas.edition{ outline:2px solid var(--or); }
.lignes-ed{ list-style:none; padding:0; margin:10px 0 6px; display:grid; gap:6px; }
.lignes-ed li{ display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:6px; align-items:center; }
.lignes-ed .nom-ed{ font-size:15px; min-width:0; overflow-wrap:anywhere; }
.lignes-ed .ecart{ display:block; font-size:12px; color:var(--brume); }
.qte{ display:flex; align-items:center; gap:4px; }
.qte button,.suppr{ width:34px; height:34px; border-radius:50%; border:1px solid var(--trait); background:var(--surface); font-weight:700; font-size:18px; padding:0; line-height:1; }
.qte input{ -moz-appearance:textfield; appearance:textfield; }
.qte input::-webkit-outer-spin-button,.qte input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.qte input{ width:58px; min-width:0; text-align:right; border:1px solid var(--trait); border-radius:10px; padding:6px 6px; background:var(--surface); font-size:15px; font-variant-numeric:tabular-nums; }
.qte .u{ font-size:13px; color:var(--brume); width:22px; }
@media (max-width:380px){ .qte button,.lignes-ed .suppr{ width:30px; height:30px; } .qte input{ width:50px; } .qte .u{ width:18px; } }
.suppr{ color:var(--alerte); }
.ajout-ed{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; margin:8px 0 10px; }
.ajout-ed select{ width:100%; min-width:0; border:1px solid var(--trait); background:var(--surface); border-radius:12px; padding:9px 10px; font-size:15px; color:var(--encre); }
.btns-ed{ display:flex; gap:8px; flex-wrap:wrap; }
.btns-ed .bouton{ padding:10px 16px; font-size:15px; }

/* ---------- Stock ---------- */
.stock-ligne{ display:grid; grid-template-columns:minmax(0,1fr) auto auto 34px; gap:8px; align-items:baseline; padding:9px 4px; border-bottom:1px solid var(--trait); font-variant-numeric:tabular-nums; }
.stock-ligne .n{ text-align:right; min-width:68px; }
.stock-tete{ font-size:12px; font-weight:700; color:var(--brume); border-bottom:1px solid var(--trait); }
.manque{ color:var(--alerte); font-weight:700; }
.jeter{ width:34px; height:34px; border-radius:50%; border:1px solid var(--trait); background:var(--surface); padding:0; display:grid; place-items:center; color:var(--brume); align-self:center; }
.jeter .ico{ width:17px; height:17px; }
.jeter-form{ grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--surface-2); border-radius:12px; padding:10px 12px; font-size:14px; }
.jeter-form input{ width:90px; border:1px solid var(--trait); border-radius:10px; padding:6px 8px; background:var(--surface); font-size:15px; text-align:right; }
.jeter-form .bouton{ padding:8px 14px; font-size:14px; }
.pertes{ margin-top:18px; }
.pertes li{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; padding:6px 0; border-bottom:1px solid var(--trait); font-size:14px; }
.pertes ul{ list-style:none; padding:0; margin:6px 0 0; }
.depasse{ margin-top:12px; border:2px solid color-mix(in srgb, var(--alerte) 40%, transparent); }
.depasse ul{ list-style:none; padding:0; margin:4px 0 12px; }
.depasse li{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--trait); font-size:14px; }
.depasse li > span{ min-width:0; }
.depasse li .discret{ display:block; font-size:12px; }
.depasse li .bouton{ padding:8px 12px; font-size:14px; flex:none; }
.depasse .modifs{ margin-top:12px; }
.courses-puces{ margin:0 0 4px; }
.generation{ margin-top:16px; }
.generation .bouton .ico{ width:20px; height:20px; }
.gen-liste{ list-style:none; padding:0; margin:12px 0; max-height:420px; overflow:auto; border-top:1px solid var(--trait); }
.gen-liste li{ display:grid; grid-template-columns:110px minmax(0,1fr); gap:10px; padding:8px 0; border-bottom:1px solid var(--trait); font-size:14px; }
.gen-jour{ font-weight:700; color:var(--titre-c); display:flex; gap:4px; align-items:flex-start; flex-wrap:wrap; }
.gen-jour .ico{ width:14px; height:14px; color:var(--or); }
.gen-repas-col{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.gen-repas{ display:block; width:100%; text-align:left; border:0; background:none; padding:5px 8px; margin:0 -8px; border-radius:10px; font-size:14px; line-height:1.35; color:var(--encre); }
.gen-repas:hover, .gen-repas:focus-visible{ background:var(--surface-2); }
.gen-repas.fort{ font-weight:700; }
.gen-repas.discret{ color:var(--brume); }
.gen-k{ display:block; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--brume); }
.choix-liste{ list-style:none; padding:0; margin:12px 0 0; }
.choix-liste li + li{ border-top:1px solid var(--trait); }
.choix-plat{ display:flex; flex-direction:column; gap:2px; width:100%; text-align:left; border:0; background:none; padding:10px 6px; border-radius:10px; font-size:15px; color:var(--encre); }
.choix-plat:hover, .choix-plat:focus-visible{ background:var(--surface-2); }
.choix-plat .discret{ font-size:13px; }
.choix-plat.actuel{ background:color-mix(in srgb, var(--or) 18%, var(--surface)); }
.feuille-ia .puces{ margin:10px 0 0; }
.gen-grille{ display:block; }
.gen-col{ min-width:0; }
.biblio, .sur-ordi{ display:none; }
.gen-repas.cible{ background:color-mix(in srgb, var(--or) 30%, var(--surface)); outline:2px dashed var(--or); }
.plein-ecran{ margin-top:8px; }
@media (min-width:960px) and (hover:hover){
  .gen-grille{ display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:18px; align-items:start; }
  .sur-ordi{ display:inline; }
  .biblio{ display:block; position:sticky; top:16px; max-height:calc(100vh - 32px); overflow:auto; background:var(--surface-2); border-radius:18px; padding:14px; margin-top:12px; }
  .biblio input{ width:100%; border:1px solid var(--trait); border-radius:12px; padding:8px 10px; background:var(--surface); font-size:14px; }
  .biblio .puces{ margin:8px 0; gap:6px; }
  .biblio .puce{ font-size:13px; padding:4px 10px; }
  .biblio-liste{ list-style:none; padding:0; margin:0; }
  .biblio-plat{ display:flex; flex-direction:column; gap:1px; padding:8px 10px; margin:4px 0; border-radius:10px; background:var(--surface); border:1px solid var(--trait); cursor:grab; font-size:14px; }
  .biblio-plat:active{ cursor:grabbing; }
  .biblio-plat.glisse{ opacity:.5; }
  .biblio-plat .discret{ font-size:12px; }
}
.courses-puces .puce span{ font-weight:500; margin-left:4px; }
.article label.qte-achat{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:4px; font-size:13px; color:var(--brume); font-weight:500; }
.article label.qte-achat input, .article label.qte-achat input:not(:placeholder-shown){ width:70px; border:1px solid var(--trait); border-radius:10px; padding:5px 8px; background:var(--surface); font-size:15px; font-weight:500; text-align:right; font-variant-numeric:tabular-nums; }

/* ---------- Boutons ---------- */
.bouton{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:14px; padding:13px 20px; font-weight:700; font-size:16px; background:var(--primaire); color:var(--sur-primaire); }
.bouton.or{ background:var(--or); color:#2C1810; }
.bouton.plein{ width:100%; }
.bouton.leger{ background:var(--surface-2); color:var(--titre-c); }
.bouton:disabled{ opacity:.5; cursor:default; }
.faim{ margin-top:18px; width:100%; justify-content:space-between; padding:18px 20px; border-radius:20px; font-size:18px; font-family:var(--titre); text-align:left; }
.faim small{ display:block; font-family:var(--texte); font-weight:500; font-size:13px; opacity:.85; }
.faim .ico{ width:30px; height:30px; }

/* ---------- Planning ---------- */
.cal{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; margin-top:16px; }
.cal .jsem{ text-align:center; font-size:12px; font-weight:700; color:var(--brume); }
.case-j{ min-width:0; overflow:hidden; color:var(--encre); background:var(--surface); border:1px solid var(--trait); border-radius:14px; min-height:78px; padding:7px 4px; display:flex; flex-direction:column; align-items:center; gap:5px; }
.case-j.vide{ background:transparent; border-color:transparent; }
.case-j .num{ font-family:var(--titre); font-weight:700; font-size:18px; line-height:1; }
.case-j .barres{ display:flex; gap:2px; }

/* ---------- Outils de format ---------- */

const echap = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function dateDuJour(j) { return new Date(DEBUT.getFullYear(), DEBUT.getMonth(), DEBUT.getDate() + j - 1); }
const jourMoisCourt = j => { const d = dateDuJour(j); return (d.getDate() === 1 ? "1er" : d.getDate()) + " " + d.toLocaleDateString("fr-FR", { month: "long" }); };

// course en cours : la dernière dont le jour est passé (la première avant le début du plan)
// Courses du cycle : celles des données, ou, après « Générer le menu selon le stock », les courses gardées

function COURSES() {

    .map(c => c.jourPlan <= (g.jourRefait || 0) ? { ...c, items: c.items.filter(it => E.foyer.achats[cleArticle(c.id, it.a)]) } : c)

  if (a === "Wraps") return nb(r, r % 1 ? 1 : 0) + (r > 1 ? " wraps" : " wrap");
  if (a === "Pains burger") return nb(r, r % 1 ? 1 : 0) + (r > 1 ? " pains" : " pain");
  if (u === "g") return q >= 1000 ? nb(q / 1000, 2) + " kg" : nb(q) + " g";

/* ---------- Prix, nutrition, coûts ---------- */
function fiche(a) { const c = DONNEES.cat[a]; if (!c) return null; const p = E.foyer.prix[a]; return p ? { ...c, prix: p.prix } : c; }
function prixUnitaire(a) { const c = fiche(a); if (!c || c.prix == null) return null; return c.vrac ? c.prix / 1000 / (c.rend || 1) : c.prix / c.cond; }

function repasPlan(j, k, p = actif) {
  const m = PLAN[j - 1].meals.find(x => x.k === k);

function repasDe(j, k, p = actif) {

}
function horsRepasJour(p = actif) { return (DONNEES.reglages.horsRepas || []).reduce((s, h) => s + (prixUnitaire(h.a) || 0) * (h.parJour[p] || 0), 0); }
function statsJour(j, p = actif) {

  for (const k of CLES) {
    const s = statsRepas(repasDe(j, k, p)), f = !!P(p).coches["d" + j + "-" + k];
    r.kcal += s.kcal; r.prot += s.prot; r.cout += s.cout;

}
function totalPrevu(p = actif) { let t = 0; for (let j = 1; j <= NB_JOURS; j++) t += statsJour(j, p).cout; return t + horsRepasJour(p) * NB_JOURS; }

/* ---------- Stock estimé du foyer ---------- */
function quantiteUtile(it) { const c = DONNEES.cat[it.a]; return c.vrac ? it.buy * (c.rend || 1) : it.buy * c.cond; }
// Stock au matin du jour j (j = 22 : fin du cycle). planSeul = sans les ajustements ni remplacements.
function stockBrut(j, planSeul = false) {
  const s = {};
  Object.assign(s, STOCK_DEPART);
  for (const c of COURSES()) if (c.jourPlan <= j) for (const it of (planSeul ? c.items : itemsCourse(c)))
    if (planSeul || !valide(c.id) || E.foyer.achats[cleLigne(c.id, it)]) s[it.a] = (s[it.a] || 0) + quantiteUtile(it);
  for (let d = 1; d < j && d <= NB_JOURS; d++) for (const p of Object.keys(PERSONNES)) for (const k of CLES)
    for (const [a, q] of (planSeul ? repasPlan(d, k, p) : repasDe(d, k, p)).items) s[a] = (s[a] || 0) - q;
  retirerInvites(s, j);
  // produits jetés (poubelle de l'onglet « À la maison ») : retirés à partir du jour où ils l'ont été
  if (!planSeul) for (const x of E.foyer.pertes || []) if (x.j <= j) s[x.a] = (s[x.a] || 0) - x.q;
  return s;
}
// Stock réel au matin du jour j : stock de départ + articles cochés (quantité achetée) − repas des jours passés − poubelle.
// Un article non coché n'est pas à la maison.
function stockReel(j) {
  const s = {};
  Object.assign(s, STOCK_DEPART);
  for (const c of COURSES()) for (const it of itemsCourse(c)) if (E.foyer.achats[cleLigne(c.id, it)]) s[it.a] = (s[it.a] || 0) + quantiteUtile(it);
  for (let d = 1; d < j && d <= NB_JOURS; d++) for (const p of Object.keys(PERSONNES)) for (const k of CLES)

  retirerInvites(s, j);

function retirerInvites(s, j) {

function stockAuDebut(j) {
  const s = stockBrut(j);

  return s;
}

/* ---------- Courses ---------- */
function texteAchat(it) { const c = DONNEES.cat[it.a]; return c.vrac ? quantite(it.a, it.buy) + " en vrac" : it.buy + " × " + c.achat; }
function est0(it) { const c = DONNEES.cat[it.a]; if (!c || c.prix == null) return null; return c.vrac ? it.buy / 1000 * c.prix : it.buy * c.prix; }
function estimationLigne(it) { const c = fiche(it.a); if (!c || c.prix == null) return null; return c.vrac ? it.buy / 1000 * c.prix : it.buy * c.prix; }
function cleArticle(cid, a) { return "c" + cid + "-" + a; }
// clé d'une ligne : un produit de remplacement garde la trace de celui qu'il remplace (« Courgettes~Poivrons »)
function cleLigne(cid, it) { return it.cle || cleArticle(cid, it.remplace ? it.a + "~" + it.remplace : it.a); }
const valide = cid => !!(E.foyer.validees || {})[cid];
// Articles d'une course après les décisions prises face à un dépassement (retraits, échanges)
function itemsCourse(c) {
  const out = [];
  for (const it of c.items) {
    const m = (E.foyer.modifs || []).find(x => x.cid === c.id && x.a === it.a);
    const l = !m ? it : m.type === "substitution" ? ligneSubstitut(it, m) : null;
    if (!l) continue;
    // quantité achetée modifiée sur la ligne (dans l'unité d'achat : conditionnements, ou grammes en vrac)
    const q = (E.foyer.quantites || {})[cleLigne(c.id, l)];
    out.push(q != null ? { ...l, prevu: l.buy, buy: q } : l);
  }
  // produits ajoutés à la main (hors liste du chef) et achats spontanés rattachés à cette course
  for (const x of ((E.foyer.ajouts || {})[c.id] || [])) {
    if (!DONNEES.cat[x.a]) continue;
    const l = { a: x.a, buy: x.buy, needN: 0, needA: 0, ajout: x.id, cle: "c" + c.id + "-+" + x.id, spontane: !!x.spontane, date: x.date };
    const q = (E.foyer.quantites || {})[l.cle];

}
// montant d'une ligne : prix payé s'il est tapé, sinon prix du moment × quantité achetée
function montantLigne(cid, it) { const v = E.foyer.payes[cleLigne(cid, it)]; return v != null && v !== "" ? +v : (estimationLigne(it) || 0); }
function ligneSubstitut(it, m) {
  const c = DONNEES.cat[m.b], needN = it.needN * m.f, needA = it.needA * m.f, need = needN + needA;
  const buy = c.vrac ? Math.ceil(need / (c.rend || 1) / 50) * 50 : Math.max(1, Math.ceil(need / c.cond - 1e-9));
  return { a: m.b, buy, needN, needA, remplace: it.a };

function part(a, p = actif) { const s = SHARE[a]; const n = s == null ? 0.5 : s; return p === "nicolas" ? n : 1 - n; }
function bilanCourse(cid, p = actif) {
  const c = COURSES().find(x => x.id === cid);
  let est = 0, maPart = 0, paye = 0, partPaye = 0, faits = 0;
  // une case cochée vaut prix validé : le montant de la ligne devient réel (payé)
  const items = itemsCourse(c), val = valide(cid);
  for (const it of items) {
    if (val && !E.foyer.achats[cleLigne(cid, it)]) continue;   // panier validé : pas coché = pas acheté
    const e = montantLigne(cid, it); est += e; maPart += e * part(it.a, p);
    if (E.foyer.achats[cleLigne(cid, it)]) { faits++; paye += e; partPaye += e * part(it.a, p); }
  }
  return { est, maPart, paye, partPaye, avenir: est - paye, faits, total: items.length };
}

/* ---------- Produits créés dans l'app (foyer.produits) : ajoutés au catalogue de la page ---------- */
function integrerProduits() {
  for (const [a, p] of Object.entries(E.foyer.produits || {})) {
    DONNEES.cat[a] = { cat: p.rayon, achat: p.achat, cond: p.cond, vrac: p.vrac ? 1 : 0, rend: 1, prix: p.prix, stock: 0, note: "Produit ajouté dans l'app" };
    if (p.nut) DONNEES.nut[a] = p.nut;
    DONNEES.catalogue[a] = { rayon: p.rayon, achat: p.achat, cond: p.cond, vrac: p.vrac ? 1 : 0, rend: 1, prix: p.prix, nut: p.nut || null,
      role: p.animal ? "proteine" : "autre", animal: !!p.animal, conservation: { jours: 7, lieu: "frigo", frais: true, estime: true }, ajoute: true };
  }
}
/* ---------- Tickets de caisse (donnees/tickets) : reportés une fois dans leur course, annulables ----------
   Une course pas encore commencée (aucune case cochée, panier non validé) reçoit les quantités et les prix payés du ticket ;
   les produits hors liste s'ajoutent. On vérifie, puis on valide le panier. */
const ISO_JOUR = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

function appliquerTickets() {
  if (ticketsSuspendus() || E.mois) return false;
  let fait = false;
  for (const t of DONNEES.tickets || []) {
    if (t.mois !== MOIS_ID || (E.foyer.imports || {})[t.id]) continue;
    const c = COURSES().find(x => x.id === t.course);
    if (!c || valide(c.id) || itemsCourse(c).some(it => E.foyer.achats[cleLigne(c.id, it)])) continue;
    reporterTicket(t, c); fait = true;
  }

}
function reporterTicket(t, c) {
  // on garde, clé par clé, ce que le ticket remplace : l'annulation ne touche à rien d'autre (achats faits depuis, autres courses)
  const F = E.foyer, avant = { achats: {}, payes: {}, quantites: {}, prix: {}, magasin: F.magasins[c.id] == null ? null : F.magasins[c.id] };
  F.quantites = F.quantites || {}; F.ajouts = F.ajouts || {}; F.imports = F.imports || {};
  const garder = (champ, cle, src) => { if (!(cle in avant[champ])) avant[champ][cle] = src[cle] === undefined ? null : JSON.parse(JSON.stringify(src[cle])); };
  for (const l of t.lignes) {
    const cc = DONNEES.cat[l.a]; if (!cc) continue;
    let it = !l.ajout && itemsCourse(c).find(x => x.a === l.a && !x.ajout && !x.remplace);
    if (!it) {

      F.ajouts[c.id] = (F.ajouts[c.id] || []).filter(x => x.id !== id).concat({ id, a: l.a, buy: l.buy, ticket: t.id });
      it = itemsCourse(c).find(x => x.ajout === id);

    garder("achats", k, F.achats); garder("payes", k, F.payes); garder("quantites", k, F.quantites); garder("prix", l.a, F.prix);
    if (Math.abs(prevu - l.buy) > 1e-9) F.quantites[k] = l.buy; else delete F.quantites[k];
    F.achats[k] = true; F.payes[k] = l.paye;
    const prix = l.prix != null ? l.prix : cc.vrac ? l.paye / (l.buy / 1000) : l.paye / l.buy;

  }

}
function annulerTicket(id) {
  const x = (E.foyer.imports || {})[id]; if (!x || !x.avant) return;
  const F = E.foyer;
  for (const champ of ["achats", "payes", "quantites", "prix"]) for (const [cle, v] of Object.entries(x.avant[champ] || {})) {
    if (v == null) delete F[champ][cle]; else F[champ][cle] = v;
  }
  for (const cid of Object.keys(F.ajouts || {})) F.ajouts[cid] = F.ajouts[cid].filter(y => y.ticket !== id);
  if (x.avant.magasin == null) delete F.magasins[x.course]; else F.magasins[x.course] = x.avant.magasin;
  F.imports[id] = { date: ISO_JOUR(new Date()), annule: true };
}
function apresChargement() { integrerProduits(); if (appliquerTickets()) sauver(); }

/* ---------- Sauvegarde : compte en ligne puis appareil ---------- */
let minuterie = null, enCours = false, encore = false;
function charger(obj) {
  if (!obj || typeof obj !== "object") return;
  // copie profonde : les données du compte en ligne peuvent arriver verrouillées en écriture ; sans copie,
  // cocher une case ou saisir un prix échouait sans bruit (c'était le bug des cases qui ne se cochaient pas)
  obj = JSON.parse(JSON.stringify(obj));
  if (!obj.version) { // migration depuis la première version (Nicolas seul)
    const n = E.personnes.nicolas;
    if (obj.coches) n.coches = obj.coches;
    if (obj.remplacements) n.remplacements = obj.remplacements;
    if (obj.pesees) n.pesees = obj.pesees;
    if (obj.profil) n.profil = { ...n.profil, ...obj.profil };
    for (const k of ["achats", "payes", "prix", "magasins"]) if (obj[k]) E.foyer[k] = obj[k];
    return;
  }
  E.foyer = { ...structuredClone(DEFAUT.foyer), ...(obj.foyer || {}) };
  E.mois = obj.mois || null; E.archives = obj.archives || {};
  for (const p of Object.keys(PERSONNES)) {
    const src = (obj.personnes || {})[p] || {}, d = structuredClone(DEFAUT.personnes[p]);
    E.personnes[p] = { ...d, ...src, profil: { ...d.profil, ...(src.profil || {}) } };
  }
  activerMois();
}
try { const l = localStorage.getItem("marmite-nicolas"); if (l) charger(JSON.parse(l)); } catch (e) {}
function sauver() {
  try { localStorage.setItem("marmite-nicolas", JSON.stringify(E)); } catch (e) {}
  clearTimeout(minuterie); minuterie = setTimeout(envoyer, 800);
}
async function envoyer() {
  if (!refDoc) return;
  if (enCours) { encore = true; return; }
  enCours = true;
  try { await refDoc.set(JSON.parse(JSON.stringify(E))); sync = "compte"; } catch (e) { sync = "hors-ligne"; }
  enCours = false;
  if (encore) { encore = false; envoyer(); }
}
async function brancherCompte() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;

  const tot = parts.reduce((t, x) => t + x.s.kcal, 0) || 1;
  let off = 0, arcs = "";

function candidatsChoix() {

  if (estPrincipal) l = l.filter(r => r.portions.nicolas.some(([a]) => DONNEES.catalogue[a] && DONNEES.catalogue[a].animal));
  const f = choix.filtre, q = choix.q.trim().toLowerCase();
  if (f === "poisson") l = l.filter(r => r.tags.includes("poisson"));
  if (f === "plaisir") l = l.filter(r => r.tags.includes("plaisir"));
  if (f === "viande") l = l.filter(r => !r.tags.includes("poisson"));
  if (q) l = l.filter(r => (r.nom || "").toLowerCase().includes(q));
  // même famille de plat déjà prévue à moins de 5 jours : signalé, pas interdit
  const ecart = DONNEES.reglages.ecartMinJours || 5, proches = {};
  for (const jj of plan) for (const m of jj.meals) {
    if (`${jj.d}-${m.k}` === choix.cle || !(m.k === "dej" || m.k === "din") || Math.abs(jj.d - d) >= ecart) continue;

    return { a, n, f };
  }).sort((x, y) => (x.f < -0.5 ? x.f : 0) - (y.f < -0.5 ? y.f : 0) || (y.n > 0.5) - (x.n > 0.5) || x.a.localeCompare(y.a, "fr"));

    <span class="n ${l.f < -0.5 ? "manque" : ""}">${l.f < -0.5 ? "manque " + quantite(l.a, -l.f) : quantite(l.a, Math.max(0, l.f))}</span>

// Projection des courses du cycle : prix payés quand ils sont saisis, sinon estimation aux derniers prix validés.
function projectionFoyer() {
  let paye = 0, avenir = 0;
  for (const c of COURSES()) { const b = bilanCourse(c.id); paye += b.paye; avenir += b.avenir; }
  const budget = budgetFoyer();
  return { paye, avenir, total: paye + avenir, budget };
}
// Budget du foyer : celui choisi pour le mois préparé par le chef, sinon la somme des budgets des profils.
// La part d'une personne suit le rapport de son budget de profil.
function budgetFoyer() { return E.mois && E.mois.budget ? +E.mois.budget : Object.keys(PERSONNES).reduce((s, p) => s + (+E.personnes[p].profil.budget || 0), 0); }
function budgetPersonne(p = actif) {
  const b = +E.personnes[p].profil.budget || 0; if (!(E.mois && E.mois.budget)) return b;
  const tot = Object.keys(PERSONNES).reduce((s, q) => s + (+E.personnes[q].profil.budget || 0), 0);
  return tot ? E.mois.budget * b / tot : E.mois.budget / 2;

// Dépassement du foyer : ce qui sera mangé sur le cycle (aux derniers prix validés) face à la somme des budgets.

function depassementFoyer() {

}
function ligneProjection() {

/* ---------- Dépassement : retirer, changer des aliments ou accepter ---------- */
function jourActuel() { return planPasCommence() ? 1 : jourDuPlan(); }
function finPeriode(c) { const n = COURSES().find(x => x.jourPlan > c.jourPlan); return n ? n.jourPlan - 1 : NB_JOURS; }
// lignes encore à acheter : pas cochées, dans une course dont la période n'est pas finie
function lignesAAcheter() {
  const out = [];
  for (const c of COURSES()) {
    if (finPeriode(c) < jourActuel() || valide(c.id)) continue;
    for (const it of itemsCourse(c)) if (!it.remplace && !E.foyer.achats[cleLigne(c.id, it)]) out.push({ c, it });
  }
  return out;
}
const HORS_REPAS_NOMS = new Set((DONNEES.reglages.horsRepas || []).map(h => h.a));
const roleDe = a => ((DONNEES.catalogue || {})[a] || {}).role || "autre";
// quantité de b qui remplace q de a : mêmes protéines pour une protéine, mêmes kcal pour un féculent, même poids sinon
function facteurEchange(a, b) {
  const na = DONNEES.nut[a], nb2 = DONNEES.nut[b]; if (!na || !nb2) return 1;
  const r = roleDe(a), i = r === "proteine" ? 3 : r === "feculent" ? 2 : -1;
  if (i < 0 || !nb2[i]) return 1;
  return Math.round((na[i] / na[0]) / (nb2[i] / nb2[0]) * 100) / 100;
}
function repasTouches(c, a) {
  let n = 0; const d0 = Math.max(c.jourPlan, jourActuel()), d1 = finPeriode(c);
  for (let d = d0; d <= d1; d++) for (const k of CLES) for (const p of Object.keys(PERSONNES)) if (repasDe(d, k, p).items.some(([x]) => x === a)) n++;
  return n;
}
function propositions() {
  const retraits = [], echanges = [];
  for (const { c, it } of lignesAAcheter()) {
    const est = estimationLigne(it); if (!est) continue;
    const r = roleDe(it.a);
    if (r !== "proteine" && r !== "feculent" && !HORS_REPAS_NOMS.has(it.a))
      retraits.push({ c, it, gain: est, repas: repasTouches(c, it.a) });
    for (const b of ((DONNEES.catalogue || {})[it.a] || {}).substituts || []) {
      if (!DONNEES.cat[b] || DONNEES.cat[b].prix == null && !E.foyer.prix[b]) continue;
      const f = facteurEchange(it.a, b), l = ligneSubstitut(it, { b, f }), gain = est - (estimationLigne(l) || 0);
      if (gain > 0.3) echanges.push({ c, it, b, f, gain, repas: repasTouches(c, it.a) });
    }
  }
  const tri = l => l.sort((x, y) => y.gain - x.gain);
  // un seul échange par ligne : le plus avantageux
  const vus = new Set();
  return { retraits: tri(retraits).slice(0, 5), echanges: tri(echanges).filter(e => { const k = e.c.id + e.it.a; if (vus.has(k)) return false; vus.add(k); return true; }).slice(0, 5) };
}

// Applique un retrait ou un échange aux repas de la période de la course (dès aujourd'hui), pour les deux personnes.
function appliquerModif(m) {
  const c = COURSES().find(x => x.id === m.cid), d0 = Math.max(c.jourPlan, jourActuel()), d1 = finPeriode(c);
  m.avant = {};
  for (const p of Object.keys(PERSONNES)) {
    m.avant[p] = {};
    for (let d = d0; d <= d1; d++) for (const k of CLES) {
      const r = repasDe(d, k, p); if (!r.items.some(([x]) => x === m.a)) continue;
      const cle = "d" + d + "-" + k, ancien = P(p).remplacements[cle];
      m.avant[p][cle] = ancien ? structuredClone(ancien) : null;
      let items = r.items.map(([a, q]) => [a, q]);
      if (m.type === "retrait") items = items.filter(([a]) => a !== m.a);
      else {
        const q = items.filter(([a]) => a === m.a).reduce((s, [, x]) => s + x, 0), qb = UNITES_SPECIALES[m.b] || ["Œufs", "Wraps", "Pains burger"].includes(m.b) ? Math.max(1, Math.round(q * m.f)) : Math.round(q * m.f / 5) * 5;

function vueBudget() {

    if (d.generer === "mois") { ouvrirPreparation(); return rendre(); }
    if (d.generer === "calculer") { gen.confirmer = false; refaire(); return rendre(); }
    if (d.generer === "autre") { gen.graine++; gen.confirmer = false; refaire(); return rendre(); }
    if (d.generer === "valider") { gen.confirmer = true; return rendre(); }
    if (d.generer === "valider-non") { gen.confirmer = false; return rendre(); }
    if (d.generer === "valider-oui") { validerMois(); return rendre(); }
    if (d.generer === "appliquer") { appliquerGeneration(); return rendre(); }
    if (d.generer === "fermer") { gen = null; return rendre(); }
    if (d.generer === "annuler") { annulerGeneration(); return rendre(); }
  }
  if (d.changer) { choix = { cle: d.changer, filtre: "tous", q: "" }; rendreChoix(); const i = document.getElementById("choix-q"); if (i && window.matchMedia && matchMedia("(min-width:700px)").matches) i.focus(); return; }
  if (d.biblioFiltre) { biblio.filtre = d.biblioFiltre; document.querySelectorAll("[data-biblio-filtre]").forEach(x => x.setAttribute("aria-pressed", x.dataset.biblioFiltre === biblio.filtre)); const l = document.getElementById("biblio-liste"); if (l) l.innerHTML = listeBiblio(); return; }
  if (d.choixFiltre) { choix.filtre = d.choixFiltre; rendreChoix(); return; }
  if (d.choixId) return remplacerRepas(d.choixId);
  if (d.choixFermer) return fermerIA();
  if (d.rouvrir) { rouvrirMois(d.rouvrir); return rendre(); }
  if (d.modifAnnuler) { annulerModif(+d.modifAnnuler); sauver(); return rendre(); }
  if (d.accepter) { E.foyer.depassementAccepte = +d.accepter; sauver(); toast("Dépassement accepté"); return rendre(); }
  if (d.prixReset) { delete E.foyer.prix[d.prixReset]; sauver(); toast(d.prixReset + " : prix d'origine rétabli"); return rendre(); }
  if (d.jeter) { jeterSel = jeterSel === d.jeter ? null : d.jeter; rendre(); const i = document.getElementById("jeter-q"); if (i) i.focus(); return; }
  if (d.jeterAnnuler) { jeterSel = null; return rendre(); }
  if (d.jeterOk) {
    const q = parseFloat((document.getElementById("jeter-q") || {}).value);
    if (q > 0) {
      const j = planPasCommence() ? 1 : jourDuPlan();
      E.foyer.pertes = (E.foyer.pertes || []).concat({ j, a: d.jeterOk, q, date: new Date().toISOString().slice(0, 10) });
      sauver(); toast(d.jeterOk + " : " + quantite(d.jeterOk, q) + " à la poubelle");
    }
    jeterSel = null; return rendre();
  }
  if (d.perteSuppr) { E.foyer.pertes.splice(+d.perteSuppr, 1); sauver(); return rendre(); }
  if (d.ajoutOuvrir) return ouvrirAjout(d.ajoutOuvrir);
  if (d.ajoutChoisir) { ajout.sel = d.ajoutChoisir; return rendreAjout(); }
  if (d.ajoutNouveau) { ajout.nouveau = true; return rendreAjout(); }
  if (d.ajoutRetour) { if (ajout.nouveau) ajout.nouveau = false; else ajout.sel = null; return rendreAjout(); }
  if (d.ajoutCreer) return creerProduit();
  if (d.ajoutOk) return validerAjout();
  if (d.ajoutSuppr) { const [cid, id] = d.ajoutSuppr.split("|"); retirerAjout(+cid, id); return rendre(); }
  if (d.panierValider) { validerSel = +d.panierValider; return rendre(); }
  if (d.panierNon) { validerSel = null; return rendre(); }
  if (d.panierOk) {
    E.foyer.validees = E.foyer.validees || {}; E.foyer.validees[+d.panierOk] = ISO_JOUR(new Date()); validerSel = null; artOuvert = null;
    sauver(); rendre(); window.scrollTo(0, 0); return toast("Panier validé");
  }
  if (d.panierRouvrir) { delete E.foyer.validees[+d.panierRouvrir]; sauver(); toast("Panier rouvert"); return rendre(); }
  if (d.replanifier) {
    gen = { mode: "stock", j0: premierJourLibre(), graine: 1, invites: 0, budget: null, res: null };
    gen.res = genererMenu(gen.j0, 1, 0, null); aller("planning");
    const g = document.querySelector(".generation"); if (g) g.scrollIntoView({ block: "start" }); return;
  }
  if (d.ticketAnnuler) { annulerTicket(d.ticketAnnuler); sauver(); toast("Report du ticket annulé"); return rendre(); }
  if (d.modeCourses) { modeMagasin = !modeMagasin; artOuvert = null; try { localStorage.setItem("marmite-courses", modeMagasin ? "magasin" : "detail"); } catch (e) {} return rendre(); }
  if (d.achat) {
    const a = E.foyer.achats; a[d.achat] ? delete a[d.achat] : (a[d.achat] = true); sauver(); return rendre();
  }
  if (d.ia) return ouvrirIA(d.ia);
  if (d.retour) { delete P().remplacements["d" + jourSel + "-" + d.retour]; sauver(); rendre(); return toast("Repas du plan rétabli"); }
  if (d.envie) { lireForm(); ia.envie = d.envie; return rendreIA(); }
  if (d.choisir) return choisir(+d.choisir);
  if (d.excluRetirer) { E.foyer.exclus = (E.foyer.exclus || []).filter(a => a !== d.excluRetirer); sauver(); return rendre(); }
  if (d.retirer) { P().profil.eviter.splice(+d.retirer, 1); sauver(); return rendre(); }
  switch (d.action) {
    case "theme": {
      const t = themeEffectif() === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = t; try { localStorage.setItem("marmite-theme", t); } catch (e) {}
      rendre(); if (ia) rendreIA(); return;
    }
    case "fermer": return fermerIA();
    case "plein-ecran": return basculerPleinEcran();
    case "proposer": return proposer();
    case "relancer": ia.etat = "form"; ia.propositions = []; return rendreIA();
    case "moins": lireForm(); ia.convives = Math.max(1, ia.convives - 1); return rendreIA();
    case "plus": lireForm(); ia.convives = Math.min(12, ia.convives + 1); return rendreIA();
    case "avec-autre": lireForm(); ia.avecAutre = !ia.avecAutre; return rendreIA();
    case "acheter": lireForm(); ia.acheter = !ia.acheter; return rendreIA();
    case "budget": lireForm(); ia.budgetActif = !ia.budgetActif; return rendreIA();
    case "pesee": {
      const v = parseFloat(document.getElementById("pesee").value);
      if (isNaN(v) || v < 30 || v > 250) return toast("Poids non valide");
      const auj = new Date().toISOString().slice(0, 10);
      P().pesees = P().pesees.filter(x => x.date !== auj).concat([{ date: auj, kg: v }]); sauver(); rendre(); return toast("Pesée enregistrée");
    }
    case "exclure": { const v = (document.getElementById("ajout-exclu") || {}).value; if (!v) return; E.foyer.exclus = (E.foyer.exclus || []).concat(v); sauver(); toast(v + " exclu des menus"); return rendre(); }
    case "eviter": { const v = document.getElementById("ajout-eviter").value.trim(); if (!v) return; P().profil.eviter.push(v); sauver(); return rendre(); }
    case "reset":
      if (confirm("Effacer les coches, remplacements et pesées " + de() + " ?")) { E.personnes[actif] = structuredClone(DEFAUT.personnes[actif]); sauver(); rendre(); toast("Suivi remis à zéro"); }
      return;
  }
}
// Écouteurs posés par affectation (document.onclick…) : si le viewer remet la page à jour sans la recharger,
// ils sont remplacés au lieu d'être doublés (un toucher cochait puis décochait aussitôt).
document.onclick = e => {
  if (e.__marmite) return; e.__marmite = true;   // un même clic n'est traité qu'une fois, quel que soit le nombre d'écouteurs
  const v = e.target.closest(".voile"); if (v && e.target === v) return fermerIA();
  const b = e.target.closest("button, .interrupteur"); if (b) return action(b);
  // liste de courses : toucher n'importe où sur la ligne coche l'article (sauf le champ « Prix payé »)
  const art = e.target.closest(".article"); if (!art || e.target.closest(".saisie, .mag-detail")) return;
  if (art.dataset.artOuvrir) { artOuvert = artOuvert === art.dataset.artOuvrir ? null : art.dataset.artOuvrir; return rendre(); }
  const c = art.querySelector("button.check"); if (c) action(c);
};
document.ondragstart = e => {
  const t = e.target.closest && e.target.closest("[data-drag-id]"); if (!t) return;
  e.dataTransfer.setData("text/plain", t.dataset.dragId); e.dataTransfer.effectAllowed = "copy"; t.classList.add("glisse");
};
document.ondragover = e => {
  const c = e.target.closest && e.target.closest("[data-changer]"); if (!c) return;
  e.preventDefault(); e.dataTransfer.dropEffect = "copy";
  if (!c.classList.contains("cible")) { document.querySelectorAll(".cible").forEach(x => x.classList.remove("cible")); c.classList.add("cible"); }
};
document.ondragleave = e => { const c = e.target.closest && e.target.closest("[data-changer]"); if (c && !c.contains(e.relatedTarget)) c.classList.remove("cible"); };
document.ondrop = e => {
  const c = e.target.closest && e.target.closest("[data-changer]"); if (!c) return;
  e.preventDefault(); const id = e.dataTransfer.getData("text/plain"); if (id) deposer(c.dataset.changer, id);
};
document.ondragend = () => document.querySelectorAll(".cible, .glisse").forEach(x => x.classList.remove("cible", "glisse"));
document.onkeydown = e => {
  if (e.key === "Escape" && (ia || choix || ajout)) return fermerIA();
  const t = e.target; if ((e.key === " " || e.key === "Enter") && t.classList && t.classList.contains("interrupteur")) { e.preventDefault(); action(t); }
};
document.oninput = e => {
  const t = e.target;
  if (t.dataset.ajoutQ != null && ajout) { ajout.q = t.value; const l = document.getElementById("ajout-liste"); if (l) l.innerHTML = listeAjout(); return; }
  if (t.dataset.biblioQ != null) { biblio.q = t.value; const l = document.getElementById("biblio-liste"); if (l) l.innerHTML = listeBiblio(); return; }
  if (t.dataset.choixQ != null && choix) { choix.q = t.value; const l = document.getElementById("choix-liste"); if (l) l.innerHTML = listeChoix(); return; } if (t.dataset.edQ == null || !edition) return;
  const v = parseFloat(t.value); edition.items[+t.dataset.edQ][1] = isNaN(v) ? 0 : Math.max(0, v);
  const inf = document.getElementById("ed-infos"); if (inf) inf.innerHTML = infosEdition();
};
document.onchange = e => {
  const t = e.target, d = t.dataset;
  if (d.paye) {
    const v = t.value === "" ? null : Math.max(0, parseFloat(t.value));
    if (v == null || isNaN(v)) delete E.foyer.payes[d.paye];
    else {
      E.foyer.payes[d.paye] = Math.round(v * 100) / 100;
      E.foyer.achats[d.paye] = true;   // un prix payé vaut article dans le panier
      const c = DONNEES.cat[d.art], buy = +d.buy;
      if (c && buy > 0) E.foyer.prix[d.art] = { prix: c.vrac ? v / (buy / 1000) : v / buy, date: new Date().toISOString().slice(0, 10), source: "paye" };
    }
    sauver(); return rendre();
  }
  if (d.gen && gen) {
    const v = parseFloat(t.value);
    if (d.gen === "j0") gen.j0 = +t.value;
    if (d.gen === "debut") { gen.debut = t.value; gen.jours = joursDuMois(dateLocale(t.value)); }
    if (d.gen === "jours") gen.jours = isNaN(v) ? gen.jours : Math.max(1, Math.min(31, Math.round(v)));
    if (d.gen === "invites") gen.invites = isNaN(v) ? 0 : Math.max(0, Math.min(12, Math.round(v)));
    if (d.gen === "budget") gen.budget = isNaN(v) || v <= 0 ? (gen.mode === "mois" ? gen.budget : null) : v;
    gen.res = null; return rendre();
  }
  if (d.qte) {
    const v = parseFloat(t.value), prevu = +d.prevu, Q = E.foyer.quantites = E.foyer.quantites || {};
    if (isNaN(v) || v < 0 || Math.abs(v - prevu) < 1e-9) delete Q[d.qte]; else Q[d.qte] = v;
    // un prix payé déjà tapé reste le montant payé ; le prix unitaire suit la nouvelle quantité
    const pay = E.foyer.payes[d.qte], c = DONNEES.cat[d.art], q = Q[d.qte] != null ? Q[d.qte] : prevu;
    if (pay != null && c && q > 0) E.foyer.prix[d.art] = { prix: c.vrac ? pay / (q / 1000) : pay / q, date: new Date().toISOString().slice(0, 10), source: "paye" };
    sauver(); return rendre();
  }
  if (d.prixA != null) {
    const v = t.value === "" ? null : parseFloat(t.value.replace(",", "."));
    if (v == null || isNaN(v) || v < 0) delete E.foyer.prix[d.prixA];
    else E.foyer.prix[d.prixA] = { prix: Math.round(v * 100) / 100, date: new Date().toISOString().slice(0, 10), source: "saisi" };
    sauver(); return rendre();
  }
  if (d.magasin) { E.foyer.magasins[d.magasin] = t.value.trim(); return sauver(); }
  if (d.profil) { const v = parseFloat(t.value); if (!isNaN(v)) { P().profil[d.profil] = v; sauver(); rendre(); } }
};
let minuterieTaille = null;
window.onresize = () => { if (vue !== "budget") return; clearTimeout(minuterieTaille); minuterieTaille = setTimeout(rendre, 200); };
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => rendreCadre());

/* ---------- Démarrage ---------- */
apresChargement();
rendre();
brancherCompte();
</script>
