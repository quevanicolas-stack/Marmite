# Met Marmite en ligne sur Cloudflare à chaque fusion dans main (ou à la demande, onglet Actions).
# Secrets du dépôt (Settings → Secrets and variables → Actions) :
#   CLOUDFLARE_API_TOKEN   jeton « Edit Cloudflare Workers » (Workers, D1 en modification)  — obligatoire
#   CLOUDFLARE_ACCOUNT_ID  identifiant du compte Cloudflare                                — obligatoire
#   CODE_FOYER             le code demandé sur chaque téléphone                            — obligatoire
#   ANTHROPIC_API_KEY      clé du chef (« J'ai faim », « Changer »)                         — facultatif
name: Cloudflare
on:
  push:
    branches: [main]
    paths: ["app/marmite.html", "cloudflare/**", ".github/workflows/cloudflare.yml"]
  workflow_dispatch:
concurrency: cloudflare
jobs:
  deployer:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier les secrets
        run: |
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!s}" ] || { echo "::error::Secret $s manquant (Settings → Secrets and variables → Actions)"; exit 1; }
          done
      - run: npm ci
      - run: python3 preparer.py
      - name: Déployer
        run: npx wrangler deploy
      - name: Secrets du Worker
        env:
          CODE_FOYER: ${{ secrets.CODE_FOYER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for s in CODE_FOYER ANTHROPIC_API_KEY; do
            if [ -n "${!s}" ]; then printf '%s' "${!s}" | npx wrangler secret put "$s"; else echo "$s non fourni : inchangé"; fi
          done
